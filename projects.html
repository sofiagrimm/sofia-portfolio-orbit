<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects | Sofia Grimm</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&family=DM+Serif+Display:ital@0;1&family=IM+Fell+English&family=Courier+Prime:wght@400;700&family=Nanum+Pen+Script&display=swap');
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;min-height:100%;background:#060d18;font-family:'Inter',sans-serif;color:#e9f0ff;overflow-x:hidden;}
    canvas{display:block;position:fixed;inset:0;z-index:0}
    .nebula{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 50% 35% at 20% 60%,rgba(30,70,170,.07) 0%,transparent 70%),radial-gradient(ellipse 40% 30% at 80% 30%,rgba(20,80,190,.07) 0%,transparent 70%),radial-gradient(ellipse 50% 44% at 50% 50%,rgba(15,35,110,.05) 0%,transparent 65%);}

    /* ── NAV ── */
    nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 48px;height:68px;}
    .nav-name{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;font-style:italic;letter-spacing:.06em;color:rgba(220,232,255,.9);text-decoration:none;white-space:nowrap;}
    .nav-links{display:flex;align-items:center;gap:4px;}
    .nav-links a{font-size:13px;font-weight:400;letter-spacing:.13em;text-transform:uppercase;color:rgba(160,190,255,.5);text-decoration:none;padding:7px 16px;border-radius:4px;transition:color .25s,background .25s;}
    .nav-links a:hover,.nav-links a.active{color:rgba(220,235,255,.9);background:rgba(100,140,255,.08);}
    .nav-links .divider{color:rgba(100,130,200,.2);font-size:13px;user-select:none;}

    /* ── PAGE ── */
    .page{position:relative;z-index:10;max-width:960px;margin:0 auto;padding:110px 32px 100px;}
    .page-eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(160,185,255,.45);margin-bottom:20px;}
    .page-title{font-family:'Cormorant Garamond',serif;font-size:54px;font-weight:300;line-height:1.08;color:#eef3ff;margin-bottom:14px;}
    .page-title em{font-style:italic;color:rgba(190,210,255,.85);}
    .page-subtitle{font-size:13px;font-weight:300;color:rgba(160,190,255,.40);letter-spacing:.06em;margin-bottom:36px;}
    .rule{width:48px;height:1px;background:linear-gradient(90deg,rgba(140,170,255,.4),transparent);margin-bottom:44px;}

    /* ── GRID — 4 col desktop, 2 col tablet, 1 col mobile ── */
    .memory-grid{position:relative;height:clamp(380px,40vw,440px);margin-top:10px}
    @media(max-width:760px){.memory-grid{height:auto;display:grid;grid-template-columns:1fr 1fr;gap:22px 16px}}
    

    /* ── MOBILE NAV ── */
    @media(max-width:600px){
      nav{padding:0 20px;height:56px;}
      .nav-name{font-size:22px;}
      .nav-links a{font-size:11px;padding:6px 10px;letter-spacing:.08em;}
      .nav-links .divider{display:none;}
      .page{padding:80px 18px 80px;}
      .page-title{font-size:36px;}
    }

    /* ── CARDS ── */
    @keyframes cardEntrance{0%{opacity:0;transform:translateY(28px) scale(0.93);}100%{opacity:1;transform:translateY(0) scale(1);}}
    @keyframes idleFloat{0%,100%{transform:translateY(0px);}50%{transform:translateY(-5px);}}
    .card-scene{aspect-ratio:3/4;perspective:900px;cursor:pointer;opacity:0;animation:cardEntrance .6s cubic-bezier(.22,1,.36,1) forwards;}
    .card-scene.floating{animation:idleFloat 4.5s ease-in-out infinite;}
    .card-scene.revealed{cursor:pointer;}
    .card-flipper{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.22,1,.36,1);border-radius:14px;will-change:transform;}
    .card-scene.flipped .card-flipper{transform:rotateY(180deg);}
    .card-face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;}
    .card-back{background:#0a1230;border:1px solid rgba(130,155,255,.18);display:flex;align-items:center;justify-content:center;transition:box-shadow .22s,border-color .22s;}
    .card-scene:not(.flipped):hover .card-back,.card-scene.revealed:hover .card-back{box-shadow:0 14px 44px rgba(100,130,255,.30),0 0 0 1px rgba(160,185,255,.20);border-color:rgba(160,185,255,.38);}
    .card-back svg{width:100%;height:100%;position:absolute;inset:0;}
    @keyframes shimmerSweep{0%{transform:translateX(-120%) rotate(22deg);opacity:0;}10%{opacity:1;}90%{opacity:1;}100%{transform:translateX(220%) rotate(22deg);opacity:0;}}
    .card-back .cb-shimmer{position:absolute;top:0;left:0;width:28%;height:100%;background:linear-gradient(90deg,transparent 0%,rgba(200,215,255,0.11) 50%,transparent 100%);animation:shimmerSweep 4.2s ease-in-out infinite;pointer-events:none;z-index:2;}
    @keyframes auroraWash{0%{background-position:0% 50%;opacity:0.07;}50%{background-position:100% 50%;opacity:0.13;}100%{background-position:0% 50%;opacity:0.07;}}
    .card-back .cb-aurora{position:absolute;inset:0;border-radius:14px;background:linear-gradient(120deg,rgba(100,130,255,0),rgba(160,100,255,0.2),rgba(80,180,255,0.15),rgba(100,130,255,0));background-size:300% 300%;animation:auroraWash 6s ease-in-out infinite;pointer-events:none;z-index:1;}
    @keyframes burstRing{0%{transform:scale(0.5);opacity:0.7;}100%{transform:scale(2.2);opacity:0;}}
    .card-back .cb-burst{position:absolute;width:60%;padding-top:60%;top:50%;left:50%;margin-top:-30%;margin-left:-30%;border-radius:50%;border:1.5px solid rgba(180,200,255,0.6);pointer-events:none;z-index:3;opacity:0;}
    .bursting .cb-burst{animation:burstRing .55s cubic-bezier(.22,1,.36,1) forwards;}
    @keyframes suitPulse{0%,100%{opacity:.55;transform:scale(1);}50%{opacity:.82;transform:scale(1.08);}}
    @keyframes cornerTwinkle{0%,100%{opacity:.55;}35%{opacity:.92;}65%{opacity:.30;}}
    @keyframes borderGlow{0%,100%{stroke-opacity:.20;}50%{stroke-opacity:.58;}}
    @keyframes particleDrift{0%{transform:translateY(0) translateX(0) scale(1);opacity:.65;}33%{transform:translateY(-7px) translateX(4px) scale(1.4);opacity:1;}66%{transform:translateY(5px) translateX(-4px) scale(.7);opacity:.45;}100%{transform:translateY(0) translateX(0) scale(1);opacity:.65;}}
    @keyframes frameRotate{to{transform:rotate(360deg);}}
    @keyframes orbitRing{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
    @keyframes orbitRingRev{from{transform:rotate(0deg);}to{transform:rotate(-360deg);}}
    .card-front{background:rgba(6,14,44,.92);border:1px solid rgba(120,150,240,.18);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transform:rotateY(180deg);padding:14px 14px 12px;display:flex;flex-direction:column;gap:5px;box-shadow:0 16px 60px rgba(0,0,0,.7),inset 0 1px 0 rgba(200,210,255,.05);}
    .fr-tag{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(140,175,255,.6);font-weight:500;}
    .fr-date{font-size:11px;letter-spacing:.10em;color:rgba(140,165,220,.45);margin-top:0;}
    .fr-rule{width:32px;height:1px;background:linear-gradient(90deg,rgba(150,170,255,.35),transparent);margin:2px 0;}
    .fr-title{font-family:'Cormorant Garamond',serif;font-size:clamp(15px,1.7vw,20px);font-weight:300;line-height:1.2;color:#ddeeff;}
    .fr-body{font-size:11.5px;font-weight:300;line-height:1.60;color:rgba(195,215,255,.60);flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;}
    .fr-link{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:rgba(160,195,255,.60);text-decoration:none;border-bottom:1px solid rgba(140,180,255,.18);align-self:flex-start;transition:color .2s;margin-top:2px;}
    .fr-link:hover{color:rgba(210,225,255,.9);}
    #cardPopupFlipper .fr-body{-webkit-line-clamp:unset;overflow:visible;}
    #cardPopupOverlay{position:fixed;inset:0;z-index:100;background:rgba(4,8,28,0);display:flex;align-items:center;justify-content:center;pointer-events:none;transition:background .35s ease;}
    #cardPopupOverlay.visible{background:rgba(4,8,28,0.72);pointer-events:auto;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
    #cardPopupInner{position:relative;width:min(320px,78vw);aspect-ratio:3/4;perspective:900px;opacity:0;transform:scale(0.45) translateY(30px);filter:blur(6px);transition:opacity .50s cubic-bezier(.22,1,.36,1),transform .50s cubic-bezier(.22,1,.36,1),filter .50s cubic-bezier(.22,1,.36,1);}
    #cardPopupOverlay.visible #cardPopupInner{opacity:1;transform:scale(1) translateY(0);filter:blur(0px);}
    #cardPopupInner.dismissing{opacity:0;transform:scale(0.45) translateY(30px);filter:blur(6px);transition:opacity .36s cubic-bezier(.55,0,.45,1),transform .36s cubic-bezier(.55,0,.45,1),filter .36s cubic-bezier(.55,0,.45,1);}
    #cardPopupClose{position:absolute;top:-16px;right:-16px;width:36px;height:36px;background:rgba(12,22,80,0.90);border:1px solid rgba(150,175,255,0.35);border-radius:50%;color:rgba(210,225,255,0.90);font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;transition:background .18s,color .18s,transform .18s,box-shadow .18s;backdrop-filter:blur(10px);box-shadow:0 4px 20px rgba(0,0,0,.5);}
    #cardPopupClose:hover{background:rgba(80,100,220,0.60);color:#fff;transform:scale(1.15) rotate(90deg);box-shadow:0 6px 28px rgba(80,120,255,.4);}
    #cardPopupFlipper{width:100%;height:100%;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.22,1,.36,1);border-radius:14px;will-change:transform;}
    #cardPopupFlipper.flipped{transform:rotateY(180deg);}


    /* ── shuffle deck ── */
    .deck-wrap{display:flex;align-items:center;gap:22px;margin:4px 0 26px}
    .deck{position:relative;width:78px;aspect-ratio:5/7;border:0;background:none;padding:0;cursor:pointer;rotate:-10deg;flex:0 0 auto}
    .deck .back{position:absolute;inset:0;display:block;border-radius:6px;box-shadow:0 1px 0 #cfccc4,0 2px 3px rgba(0,0,0,.35)}
    .deck .back svg{display:block;width:100%;height:100%}
    .deck .b1{translate:0 8px}.deck .b2{translate:1px 6px}.deck .b3{translate:2px 4px}.deck .b4{translate:2px 2px}.deck .b5{translate:3px 0;box-shadow:0 10px 18px rgba(0,0,0,.45)}
    .deck:hover .b5,.deck:focus-visible .b5{translate:3px -6px}
    .deck:focus-visible{outline:3px solid #9cc0ff;outline-offset:8px;border-radius:8px}
    .deck .back{transition:translate .25s ease}
    .deck.shuffling .b2,.deck.shuffling .b4{animation:cutLeft .7s ease-in-out}
    .deck.shuffling .b3,.deck.shuffling .b5{animation:cutRight .7s ease-in-out}
    @keyframes cutLeft{0%,100%{transform:none}40%{transform:translateX(-62%) rotate(-10deg)}60%{transform:translateX(-62%) rotate(-10deg)}}
    @keyframes cutRight{0%,100%{transform:none}40%{transform:translateX(62%) rotate(10deg)}60%{transform:translateX(62%) rotate(10deg)}}
    .deck-label{font-family:'Nanum Pen Script',cursive;font-size:34px;line-height:1;color:#f1ecdc;transform:rotate(-3deg)}
    .card-scene.drawn .card-back{box-shadow:0 0 0 3px #f3b6c8,0 22px 40px rgba(0,0,0,.55)}
    @media (prefers-reduced-motion:reduce){.deck.shuffling .back{animation:none}}
    /* ── HAND-PAINTED PLAYING CARDS ── */
    .card-scene{aspect-ratio:5/7;position:absolute;left:var(--x);top:var(--y);width:clamp(140px,17vw,180px);
      rotate:var(--r);transform-origin:50% 120%;translate:0 0;transition:translate .3s cubic-bezier(.2,.8,.2,1);z-index:var(--z)}
    .card-scene:hover,.card-scene:focus-visible{translate:0 -28px;z-index:20;outline:none}
    .card-scene:focus-visible .card-back{box-shadow:0 0 0 3px #9cc0ff,0 16px 30px rgba(0,0,0,.5)}
    @media(max-width:760px){
      .card-scene{position:relative;left:auto;top:auto;width:100%;rotate:var(--rm);transform-origin:50% 50%}
      .card-scene:hover,.card-scene:focus-visible{translate:0 -8px}
    }
    .card-face{border-radius:12px}
    .card-flipper{border-radius:12px}
    .card-back{background:transparent;border:0;box-shadow:0 10px 22px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.35);display:block;border-radius:14px}
    .card-scene:not(.flipped):hover .card-back,.card-scene.revealed:hover .card-back{box-shadow:0 22px 40px rgba(0,0,0,.55),0 2px 4px rgba(0,0,0,.35);border:0}
    .card-back .cb-aurora,.card-back .cb-shimmer,.card-back .cb-burst{display:none}
    .card-back svg{position:absolute;inset:0;width:100%;height:100%}
    #cardPopupInner{aspect-ratio:5/7}
    .card-front{background:radial-gradient(ellipse at 30% 20%,#fbf7ee 0%,#f3ecdd 70%,#e9e0cc 100%);border:0;backdrop-filter:none;-webkit-backdrop-filter:none;
      padding:20px 20px 16px;gap:6px;box-shadow:0 14px 34px rgba(0,0,0,.5),0 2px 4px rgba(0,0,0,.35);border-radius:12px}
    .fr-tag{font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:.02em;text-transform:none;color:#6a6052;font-weight:400}
    .fr-date{font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:0;color:#8a7f6e}
    .fr-rule{width:36px;height:1.5px;background:#c8433c;margin:4px 0}
    .fr-title{font-family:'DM Serif Display',Georgia,serif;font-style:italic;font-weight:400;font-size:clamp(17px,1.7vw,21px);line-height:1.15;color:#2b2620}
    .fr-body{font-family:'Courier Prime',monospace;font-size:11.5px;line-height:1.55;color:#3b342b}
    .fr-link{font-family:'Nanum Pen Script',cursive;font-size:21px;letter-spacing:0;text-transform:none;color:#24306b;border-bottom:1px solid #24306b55}
    .fr-link:hover{color:#16204f}
    .fr-road{position:absolute;right:0;top:0;bottom:0;width:27%;height:100%;border-radius:0 12px 12px 0;pointer-events:none}
    .card-front:has(.fr-road) > :not(.fr-road){margin-right:25%}
    .card-front:has(.fr-road) .fr-body{font-size:11px;line-height:1.5}
    #cardPopupClose{background:#f3ecdd;color:#2b2620;border:0}
    #cardPopupClose:hover{background:#fff;color:#2b2620;box-shadow:0 6px 20px rgba(0,0,0,.4)}
    @media (prefers-reduced-motion:reduce){.card-scene{animation:none;opacity:1;transition:none}.card-flipper{transition:none}}
    .coords{position:fixed;bottom:32px;left:48px;z-index:20;font-size:10px;letter-spacing:.18em;color:rgba(110,130,190,.28);font-weight:300;pointer-events:none;}
    @media(max-width:600px){.coords{display:none;}}
  </style>

    /* six tabs: let the nav scroll sideways on small screens instead of spilling off */
    @media (max-width:640px){
      .nav-links{overflow-x:auto;max-width:calc(100vw - 120px);scrollbar-width:none;-webkit-overflow-scrolling:touch}
      .nav-links::-webkit-scrollbar{display:none}
      .nav-links a{flex-shrink:0}
    }
  </style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>

  <script>
    const PROJECTS = [
      { tag:"Startup · MedTech", date:"Mar 2026 – Present", title:"PCDD (Patient-Controlled Drug Deactivation Device)", body:"Biomedical Engineering Innovation Fellow on a patient-controlled drug deactivation device at Yale School of Engineering under Dr. Wiznia. I sourced a 14-carbon panel from five suppliers and wrote the characterization and adsorption-screening protocols. I lead the HPLC work, validating HPLC and UV-Vis methods against the DEA non-retrievable standard.", link:"#", linkLabel:"In progress →" },
      { tag:"Hackathon · React", date:"March 2026", title:"Vantage: Professional Analytics Terminal", body:"A trading terminal built on live Polymarket data in React and TypeScript, with order-book charts, payoff curves, Kelly sizing, portfolio analytics, and a perp-hedge overlay that accounts for funding drag. I built and shipped it alone over one hackathon weekend and won Best Solo Hack (and a Framework laptop).", link:"https://devpost.com/software/vantage-gnt2kb?ref_content=user-portfolio&ref_feature=in_progress", linkLabel:"View project →" },
      { tag:"Healthcare · Consulting", date:"Jan 2026 – Present", title:"Decision Support Tool for the American Red Cross", body:"Built for YHCC's Red Cross fleet engagement. It's a Python model that turns regional donation targets into the minimum number of bloodmobiles and support vehicles each region needs, given how often vehicles are actually in use. It then compares that to current inventory to show which regions are over or under, with a mileage-band overlay on top. Sensitivity testing on collection rates is planned.", link:"#", linkLabel:"In progress →" },
      { tag:"Strategy · Consulting", date:"Feb 2026 – Present", title:"ASEAN Market Expansion Strategy for Nicol David Organization", body:"With Yale's Global Strategy Consulting Group, I worked on how the Nicol David Organization could expand across Southeast Asia. We compared ASEAN countries on youth wellbeing needs, schools, funding, and policy, then scored each on impact, ease of entry, funding access, and partners. Singapore came out on top. We recommended registering there as a company limited by guarantee, which donors tend to trust, running the region from Singapore, and starting small pilots in Indonesia next.", link:"#", linkLabel:"In progress →" },
      { tag:"ML · Astrophysics", date:"2023", title:"Gravitational Lens CNN Classifier · Fermilab", body:"Generated two 40,000-image benchmark datasets of double-source plane lenses and Einstein rings at Fermi National Accelerator Laboratory. Trained CNNs (PyTorch) for automated morphological classification. Published at AGU Annual Meeting.", link:"https://agu.confex.com/agu/fm23/meetingapp.cgi/Paper/1438256", linkLabel:"View publication →" },
      { tag:"Operations Research · Policy", date:"2022 – 2023", title:"Green Vehicle Routing · CCIR", body:"Built a mixed-integer linear programming model in Julia for the green vehicle routing problem: planning public transit routes that keep costs down while staying within emissions and capacity limits. Done through CCIR's Future Scholar Program, where I was named a Spotlight Scholar.", link:"#", linkLabel:"CCIR Spotlight Scholar →" },
      { tag:"Web · 3D Design", date:"April 2026", title:"This Interactive Portfolio", body:"A 3D homepage built with Three.js. The constellations twinkle, the ringed planets spin on their own, and the cards are frosted glass. I designed it from scratch.", link:"index.html", linkLabel:"View live →" },
      { tag:"Hackathon · MedTech", date:"April 2026", title:"NeuroPrint", body:"A browser-based tool for tracking Parkinson's at home, built at HackDartmouth. Patients do movement tasks like sit-to-stand, standing balance, gait turns, and shoulder range of motion while MediaPipe tracks their joints in the browser, so raw video never leaves the device. A FastAPI and SQLite backend saves each session, and a React dashboard shows clinicians how a patient's movement changes over time against age-matched references. We placed 3rd overall, won AirPods, and got a fast-track interview with Adaptional, a YC-backed startup.", link:"https://devpost.com/software/neuroprint-cky41g?ref_content=my-projects-tab&ref_feature=my_projects", linkLabel:"View on Devpost →" }
    ];

    // Line-art cat playing cards, after the two of spades Sofia drew.
    // Each project is a different card; the number of pips in each scene matches the rank.
    // Suits are SVG paths (not text) so phones never turn them into emoji.
    const HAND = [
      {rank:"3", suit:"diamond", label:"PCDD", scene:"lab"},
      {rank:"5", suit:"spade",   label:"Vantage", scene:"laptop"},
      {rank:"4", suit:"heart",   label:"Red Cross fleet", scene:"car"},
      {rank:"6", suit:"club",    label:"ASEAN expansion", scene:"islands"},
      {rank:"7", suit:"spade",   label:"Fermilab lenses", scene:"telescope"},
      {rank:"8", suit:"diamond", label:"green routing", scene:"bus"},
      {rank:"JOKER", suit:null,  label:"this website", scene:"joker"},
      {rank:"9", suit:"heart",   label:"NeuroPrint", scene:"stretch"}
    ];
    const SUIT_PATH = {
      heart:"M50 90 C20 68 5 52 5 33 C5 18 16 8 30 8 C40 8 46 14 50 23 C54 14 60 8 70 8 C84 8 95 18 95 33 C95 52 80 68 50 90Z",
      diamond:"M50 3 L84 50 L50 97 L16 50Z",
      spade:"M50 4 C64 25 93 40 93 61 C93 75 81 83 68 81 C62 80 57 77 54 72 C55 81 59 89 67 95 L33 95 C41 89 45 81 46 72 C43 77 38 80 32 81 C19 83 7 75 7 61 C7 40 36 25 50 4Z",
      club:"M50 10 a18 18 0 1 1 -0.1 0Z M27 41 a18 18 0 1 1 -0.1 0Z M73 41 a18 18 0 1 1 -0.1 0Z M45 58 C45 76 41 86 32 95 L68 95 C59 86 55 76 55 58Z"
    };
    const INK="#1c1a19", RED="#c8413b";
    const isRed=s=>s==='heart'||s==='diamond';
    const pipC=s=>isRed(s)?RED:INK;
    function pip(s,x,y,size,rot){
      const k=size/100;
      return `<path d="${SUIT_PATH[s]}" fill="${pipC(s)}" transform="translate(${x} ${y}) rotate(${rot||0}) translate(${-size/2} ${-size/2}) scale(${k})"/>`;
    }
    const L=`fill="none" stroke="${INK}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"`;
    const W=`fill="#fbf8f1" stroke="${INK}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"`;

    // A sitting cat, drawn around (0,0) = middle of its chest. arm: [x,y] paw position, or null.
    function cat(x,y,s,o){
      o=o||{};
      const flip=o.flip?-1:1;
      // arm targets are given in card coordinates; convert to the cat's own coordinates
      if(o.arm) o.arm=[((o.arm[0]-x)/(s*flip)).toFixed(1)*1,((o.arm[1]-y)/s).toFixed(1)*1];
      const head=`<path d="M-24 -40 C-26 -56 -20 -64 -15 -66 L-18 -82 L-5 -71 C-2 -72 2 -72 5 -71 L18 -82 L15 -66 C20 -64 26 -56 24 -40 C22 -28 11 -24 0 -24 C-11 -24 -22 -28 -24 -40Z" ${W}/>`;
      const spotHead=o.spots?`<path d="M5 -71 L18 -82 L15 -66 C18 -63 21 -58 22 -54 C14 -56 8 -62 5 -71Z" fill="${INK}"/>`:'';
      const face=`<ellipse cx="-9" cy="-46" rx="2.2" ry="3.2" fill="${INK}"/><ellipse cx="9" cy="-46" rx="2.2" ry="3.2" fill="${INK}"/>
        <path d="M-1.8 -39.5 L1.8 -39.5 L0 -37.5Z" fill="${INK}"/><path d="M-4.5 -35.5 Q-2.2 -33 0 -35.5 Q2.2 -33 4.5 -35.5" ${L} stroke-width="1.5"/>
        <path d="M-14 -40 L-26 -42 M-14 -37 L-25 -35 M14 -40 L26 -42 M14 -37 L25 -35" ${L} stroke-width="1"/>`;
      const body=`<path d="M-17 -26 C-27 -12 -28 14 -22 30 L22 30 C28 14 27 -12 17 -26" ${W}/>
        <path d="M22 26 C44 26 48 4 36 -2" ${L}/>
        <path d="M-14 30 q0 -8 6 -8 q6 0 6 8 M2 30 q0 -8 6 -8 q6 0 6 8" ${L} stroke-width="1.8"/>`;
      const spotBody=o.spots?`<ellipse cx="-8" cy="6" rx="5" ry="6" fill="${INK}"/>`:'';
      const bow=o.bow?`<path d="M0 -24 l-8 -5 l0 10z M0 -24 l8 -5 l0 10z" ${W} stroke-width="1.6"/><circle cx="0" cy="-24" r="2" fill="${INK}"/>`:'';
      const arm=o.arm?`<path d="M12 -18 C${(12+o.arm[0])/2+4} ${(-18+o.arm[1])/2+6} ${o.arm[0]-4} ${o.arm[1]+6} ${o.arm[0]} ${o.arm[1]}" ${L} stroke-width="5.5"/>
        <path d="M12 -18 C${(12+o.arm[0])/2+4} ${(-18+o.arm[1])/2+6} ${o.arm[0]-4} ${o.arm[1]+6} ${o.arm[0]} ${o.arm[1]}" fill="none" stroke="#fbf8f1" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="${o.arm[0]}" cy="${o.arm[1]}" r="4.2" ${W} stroke-width="1.8"/>`:'';
      const extra=o.extra||'';
      return `<g transform="translate(${x} ${y}) scale(${s*flip} ${s})">${body}${spotBody}${head}${spotHead}${face}${bow}${extra}${arm}</g>`;
    }

    const SCENES = {
      // 3 of diamonds: a cat dropping carbon "crystals" into a flask
      lab:()=>`
        <path d="M60 266 L196 266" ${L}/>
        <path d="M146 196 L146 222 L124 260 Q121 266 128 266 L186 266 Q193 266 190 260 L168 222 L168 196" ${W}/>
        <path d="M142 196 L172 196" ${L}/><path d="M131 248 L183 248" ${L} stroke-width="1.4" stroke-dasharray="3 4"/>
        ${pip('diamond',157,254,20)}
        ${pip('diamond',157,176,20)}
        ${pip('diamond',157,140,20,12)}
        <path d="M118 128 L152 162" ${L} stroke-width="3"/><path d="M114 124 l-6 -6" ${L} stroke-width="7"/>
        ${cat(92,206,1,{arm:[118,128],bow:true})}`,
      // 5 of spades: a cat watching a chart of spades climb out of a laptop
      laptop:()=>`
        <path d="M92 222 L176 222 L190 252 L78 252Z" ${W}/><rect x="98" y="166" width="72" height="56" rx="4" ${W}/>
        <path d="M104 210 L118 198 L130 204 L146 186 L162 176" ${L} stroke-width="1.6"/>
        ${pip('spade',120,148,18)}${pip('spade',140,126,18)}${pip('spade',160,104,18)}${pip('spade',180,82,18)}${pip('spade',200,60,18)}
        <path d="M104 156 C130 140 170 100 196 62" ${L} stroke-width="1.2" stroke-dasharray="2 5"/>
        ${cat(70,226,.9,{spots:true,arm:[96,196]})}`,
      // 4 of hearts: a cat driving a little bloodmobile
      car:()=>`
        <path d="M58 236 L58 214 Q58 206 66 205 L88 202 L102 176 Q105 170 112 170 L170 170 Q180 170 184 178 L196 202 Q202 204 202 212 L202 236 Q202 242 196 242 L64 242 Q58 242 58 236Z" ${W}/>
        <circle cx="90" cy="244" r="14" ${W}/><circle cx="90" cy="244" r="4" fill="${INK}"/><circle cx="172" cy="244" r="14" ${W}/><circle cx="172" cy="244" r="4" fill="${INK}"/>
        <path d="M140 176 L140 202 L188 202 L178 180 Q176 176 170 176Z" ${W}/>
        <g clip-path="url(#win)">${cat(162,226,.62,{bow:true})}</g>
        <path d="M40 222 q-6 -6 0 -12 q-6 -8 4 -12" ${L} stroke-width="1.6"/>
        ${pip('heart',108,222,22)}${pip('heart',38,184,16,-12)}${pip('heart',60,150,14,8)}${pip('heart',40,118,12,-6)}`,
      // 6 of clubs: club "trees" on islands, a cat planting a flag in Singapore
      islands:()=>`
        <path d="M44 250 Q70 222 104 230 Q134 236 148 250Z" ${W}/>
        <path d="M150 210 Q172 194 202 206 L206 214 L146 214Z" ${W}/>
        <path d="M40 274 q10 -6 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" ${L} stroke-width="1.6"/>
        <path d="M40 286 q10 -6 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" ${L} stroke-width="1.6"/>
        ${pip('club',62,212,24)}${pip('club',90,196,28)}${pip('club',164,180,22)}${pip('club',190,186,18)}
        <path d="M124 228 L124 168" ${L}/><path d="M124 168 L148 176 L124 184" ${W}/>
        ${pip('club',80,106,22,-10)}${pip('club',176,112,20,14)}
        ${cat(116,214,.62,{arm:[124,186],spots:true})}`,
      // 7 of spades: a cat at a telescope, spades for stars
      telescope:()=>`
        <path d="M150 268 L170 214 L190 268 M170 214 L170 268" ${L}/>
        <g transform="rotate(-38 170 210)"><rect x="132" y="200" width="78" height="20" rx="3" ${W}/><rect x="122" y="203" width="12" height="14" rx="2" ${W}/><path d="M150 200 L150 220 M190 200 L190 220" ${L} stroke-width="1.4"/></g>
        ${pip('spade',58,74,16)}${pip('spade',96,58,14,10)}${pip('spade',138,70,18)}${pip('spade',188,58,16,-8)}${pip('spade',210,104,14)}${pip('spade',112,104,12,-12)}${pip('spade',162,112,14,6)}
        ${cat(98,236,.95,{bow:true,arm:[134,200]})}`,
      // 8 of diamonds: a cat on a little bus, diamonds for stops along the route
      bus:()=>{
        const stops=[[56,74],[96,92],[146,78],[194,100],[176,148],[124,140],[76,152],[58,196]];
        return `<path d="M56 74 C70 96 82 92 96 92 C118 92 130 72 146 78 C170 86 184 90 194 100 C206 116 196 140 176 148 C160 154 140 138 124 140 C104 142 92 156 76 152 C62 150 52 170 58 196" ${L} stroke-width="1.4" stroke-dasharray="3 5"/>
          ${stops.map(([x,y],i)=>pip('diamond',x,y,16,i%2?8:-8)).join('')}
          <rect x="76" y="206" width="124" height="52" rx="10" ${W}/>
          <rect x="88" y="214" width="26" height="20" rx="3" ${W}/><rect x="120" y="214" width="26" height="20" rx="3" ${W}/><rect x="152" y="214" width="26" height="20" rx="3" ${W}/>
          <circle cx="104" cy="260" r="10" ${W}/><circle cx="176" cy="260" r="10" ${W}/><circle cx="104" cy="260" r="3" fill="${INK}"/><circle cx="176" cy="260" r="3" fill="${INK}"/>
          <rect x="182" y="214" width="12" height="24" rx="2" ${W}/>
          <g clip-path="url(#busw)">${cat(133,250,.55,{spots:true})}</g>`;
      },
      // Joker: a cat in a ruff juggling three little planets
      joker:()=>`
        ${['J','O','K','E','R'].map((c,i)=>`<text x="30" y="${66+i*32}" font-family="'DM Serif Display',Georgia,serif" font-size="28" fill="${INK}" text-anchor="middle">${c}</text>`).join('')}
        <path d="M100 96 C118 52 168 52 186 96" ${L} stroke-width="1.2" stroke-dasharray="2 5"/>
        <circle cx="104" cy="98" r="10" ${W}/><circle cx="143" cy="58" r="10" ${W}/><ellipse cx="143" cy="58" rx="18" ry="5" ${L} stroke-width="1.6" transform="rotate(-14 143 58)"/><circle cx="184" cy="98" r="10" fill="${INK}"/>
        ${cat(143,214,1.05,{arm:[176,106],extra:`<path d="M-20 -26 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l-6 7 l-6 -4 l-6 4 l-6 -4 l-6 4 l-6 -4 l-6 4z" ${W} stroke-width="1.6"/><path d="M-8 -70 L-16 -96 L0 -84 L16 -96 L8 -70" ${W} stroke-width="1.8"/><circle cx="-16" cy="-97" r="3" fill="${INK}"/><circle cx="16" cy="-97" r="3" fill="${INK}"/>`})}
`,
      // 9 of hearts: a cat doing a stretch while tracking dots follow its joints
      stretch:()=>{
        const trail=[[60,110],[72,92],[88,80],[106,72],[124,70],[142,72],[160,80],[176,92],[188,110]];
        return `<path d="M60 110 C80 72 168 60 188 110" ${L} stroke-width="1.2" stroke-dasharray="2 5"/>
          ${trail.map(([x,y])=>pip('heart',x,y,15)).join('')}
          <rect x="176" y="196" width="24" height="40" rx="4" ${W}/><circle cx="188" cy="208" r="5" ${L} stroke-width="1.6"/><path d="M188 236 L180 266 M188 236 L196 266" ${L} stroke-width="1.6"/>
          <path d="M60 270 L206 270" ${L}/>
          ${cat(112,238,1,{arm:[146,150],bow:true,extra:`<circle cx="12" cy="-18" r="3.4" fill="none" stroke="${RED}" stroke-width="1.4"/><circle cx="-12" cy="-18" r="3.4" fill="none" stroke="${RED}" stroke-width="1.4"/><circle cx="-14" cy="24" r="3.4" fill="none" stroke="${RED}" stroke-width="1.4"/>`})}`;
      }
    };

    function makeCardBackSVG(idx){
      const h=HAND[idx]||HAND[0], f=idx+Math.random().toString(36).slice(2,6);
      const defs=`<defs>
        <filter id="tex${f}" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" seed="${idx+3}" result="n"/>
          <feColorMatrix in="n" type="matrix" values="0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .42  0 0 0 -2 1.25"/><feComposite in2="SourceGraphic" operator="in"/></filter>
        <clipPath id="clip${f}"><rect x="4" y="4" width="242" height="342" rx="10"/></clipPath>
        <clipPath id="win"><path d="M140 176 L140 202 L188 202 L178 180 Q176 176 170 176Z"/></clipPath>
        <clipPath id="busw"><rect x="120" y="214" width="26" height="20" rx="3"/></clipPath>
      </defs>`;
      const paper=`<g clip-path="url(#clip${f})"><rect x="4" y="4" width="242" height="342" fill="#f6f2e8"/><rect x="4" y="4" width="242" height="342" fill="#fff" filter="url(#tex${f})" opacity=".22"/></g>
        <rect x="4.5" y="4.5" width="241" height="341" rx="10" fill="none" stroke="#d6cdb9" stroke-width="1"/>`;
      let corners='';
      if(h.suit){
        const c=`<text x="27" y="44" font-family="'DM Serif Display',Georgia,serif" font-size="30" fill="${pipC(h.suit)}" text-anchor="middle">${h.rank}</text>${pip(h.suit,27,62,17)}`;
        corners=c+`<g transform="rotate(180 125 175)">${c}</g>`;
      }
      const label=`<text x="125" y="324" font-family="'Nanum Pen Script',cursive" font-size="22" fill="#6a6560" text-anchor="middle">${h.label}</text>`;
      return `<svg viewBox="0 0 250 350" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${defs}${paper}${corners}${SCENES[h.scene]()}${label}</svg>`;
    }

    // Winding road with little cars, for the back of the Red Cross card.
    function roadSVG(){
      const f='rd'+Math.random().toString(36).slice(2,6);
      const P=[[64,-10],[8,58],[6,104],[46,140],[86,176],[90,226],[52,264],[14,300],[12,352],[60,410]];
      // cubic segments: P0 c1 c2 P1, P1 c1 c2 P2 ...
      const seg=[[P[0],P[1],P[2],P[3]],[P[3],P[4],P[5],P[6]],[P[6],P[7],P[8],P[9]]];
      const d=`M${P[0]} C${P[1]} ${P[2]} ${P[3]} C${P[4]} ${P[5]} ${P[6]} C${P[7]} ${P[8]} ${P[9]}`;
      function at(si,t){const [a,b,c,e]=seg[si],u=1-t;
        const x=u*u*u*a[0]+3*u*u*t*b[0]+3*u*t*t*c[0]+t*t*t*e[0], y=u*u*u*a[1]+3*u*u*t*b[1]+3*u*t*t*c[1]+t*t*t*e[1];
        const dx=3*u*u*(b[0]-a[0])+6*u*t*(c[0]-b[0])+3*t*t*(e[0]-c[0]), dy=3*u*u*(b[1]-a[1])+6*u*t*(c[1]-b[1])+3*t*t*(e[1]-c[1]);
        return [x,y,Math.atan2(dy,dx)*180/Math.PI];}
      const car=(si,t,col,off)=>{const [x,y,a]=at(si,t);
        return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(a+90).toFixed(1)}) translate(${off} 0)">
          <rect x="-5" y="-8" width="10" height="16" rx="3.5" fill="${col}" stroke="#3a3632" stroke-width=".8"/>
          <rect x="-3.6" y="-5" width="7.2" height="4" rx="1.2" fill="#bfe0ee" stroke="#3a3632" stroke-width=".5"/>
          <rect x="-3.6" y="2.4" width="7.2" height="2.6" rx="1" fill="#bfe0ee" stroke="#3a3632" stroke-width=".5" opacity=".8"/></g>`;};
      return `<svg class="fr-road" viewBox="0 0 100 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs><filter id="${f}" x="-10%" y="-5%" width="120%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="3" seed="7" result="n"/>
          <feColorMatrix in="n" type="matrix" values="0 0 0 0 .2  0 0 0 0 .2  0 0 0 0 .2  0 0 0 -1.6 .9" result="m"/><feComposite in="m" in2="SourceGraphic" operator="in" result="spots"/>
          <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="spots"/></feMerge></filter></defs>
        <path d="${d}" fill="none" stroke="#7d7b78" stroke-width="30" stroke-linecap="butt" filter="url(#${f})"/>
        <path d="${d}" fill="none" stroke="#fbfaf6" stroke-width="25" opacity=".95"/>
        <path d="${d}" fill="none" stroke="#8a8784" stroke-width="22" filter="url(#${f})"/>
        <path d="${d}" fill="none" stroke="#fbfaf6" stroke-width="1.6" stroke-dasharray="5 6"/>
        <circle cx="62" cy="152" r="2.4" fill="#4a4745" opacity=".6"/><circle cx="24" cy="318" r="2" fill="#4a4745" opacity=".55"/>
        ${car(0,.18,'#e7d27a',-5)}${car(1,.32,'#e8743b',5)}${car(1,.82,'#e7d27a',-5)}${car(2,.45,'#5f86a8',5)}
      </svg>`;
    }

    function makeFrontHTML(p){
      const linkAttr=(p.link&&p.link!=='#')
        ?`href="${p.link}" target="_blank" rel="noopener"`
        :`href="${p.link}"`;
      return `
        <span class="fr-tag">${p.tag}</span>
        <span class="fr-date">${p.date}</span>
        <div class="fr-rule"></div>
        <div class="fr-title">${p.title}</div>
        <div class="fr-body">${p.body}</div>
        <a class="fr-link" ${linkAttr}>${p.linkLabel}</a>
        ${/Red Cross/.test(p.title)?roadSVG():''}
      `;
    }

    const popupOverlay=document.getElementById('cardPopupOverlay');
    const popupInner=document.getElementById('cardPopupInner');
    const popupFlipper=document.getElementById('cardPopupFlipper');
    const popupClose=document.getElementById('cardPopupClose');
    let activeSceneEl=null,activeIdx=-1,popupLocked=false;

    function buildPopupCard(idx){
      popupFlipper.innerHTML='';
      popupFlipper.classList.remove('flipped');
      const back=document.createElement('div');
      back.className='card-face card-back';
      back.innerHTML=makeCardBackSVG(idx);
      const aurora=document.createElement('div');aurora.className='cb-aurora';aurora.style.animationDelay=(idx*0.55)+'s';back.appendChild(aurora);
      const shimmer=document.createElement('div');shimmer.className='cb-shimmer';shimmer.style.animationDelay=(idx*0.60)+'s';back.appendChild(shimmer);
      const burst=document.createElement('div');burst.className='cb-burst';back.appendChild(burst);
      const front=document.createElement('div');front.className='card-face card-front';front.innerHTML=makeFrontHTML(PROJECTS[idx]);
      popupFlipper.appendChild(back);popupFlipper.appendChild(front);
      return{burst};
    }

    function openPopup(sceneEl,idx){
      if(popupLocked)return;
      popupLocked=true;activeSceneEl=sceneEl;activeIdx=idx;
      const{burst}=buildPopupCard(idx);
      popupInner.classList.remove('dismissing');
      popupOverlay.classList.add('visible');
      setTimeout(()=>{
        popupFlipper.classList.add('flipped');
        popupInner.classList.add('bursting');
        burst.addEventListener('animationend',()=>{popupInner.classList.remove('bursting');},{once:true});
        setTimeout(()=>{popupLocked=false;},700);
      },480);
    }

    function closePopup(){
      if(popupLocked||!activeSceneEl)return;
      popupLocked=true;
      popupInner.classList.add('dismissing');
      setTimeout(()=>{
        popupOverlay.classList.remove('visible');
        popupInner.classList.remove('dismissing');
        activeSceneEl.classList.add('flipped','revealed');
        activeSceneEl=null;activeIdx=-1;popupLocked=false;
      },380);
    }

    popupClose.addEventListener('click',closePopup);
    popupOverlay.addEventListener('click',(e)=>{if(e.target===popupOverlay)closePopup();});
    document.addEventListener('keydown',(e)=>{if(e.key==='Escape')closePopup();});

    const grid=document.getElementById('memoryGrid');
    PROJECTS.forEach((p,i)=>{
      const scene=document.createElement('div');scene.className='card-scene';scene.style.animationDelay=(i*0.07)+'s';const n=PROJECTS.length,c=(n-1)/2,off=i-c;scene.style.setProperty('--r',(off*6.5)+'deg');scene.style.setProperty('--x',`calc(50% - clamp(70px,8.5vw,90px) + ${off}*clamp(74px,9vw,98px))`);scene.style.setProperty('--y',(Math.abs(off)*Math.abs(off)*3+20)+'px');scene.style.setProperty('--z',i+1);scene.style.setProperty('--rm',((i%2?1:-1)*(1.5+i%3))+'deg');scene.tabIndex=0;scene.setAttribute('role','button');scene.setAttribute('aria-label',p.title);
      const flipper=document.createElement('div');flipper.className='card-flipper';
      const back=document.createElement('div');back.className='card-face card-back';back.innerHTML=makeCardBackSVG(i);
      const aurora=document.createElement('div');aurora.className='cb-aurora';aurora.style.animationDelay=(i*0.55)+'s';back.appendChild(aurora);
      const shimmer=document.createElement('div');shimmer.className='cb-shimmer';shimmer.style.animationDelay=(i*0.60)+'s';back.appendChild(shimmer);
      const burst=document.createElement('div');burst.className='cb-burst';back.appendChild(burst);
      const front=document.createElement('div');front.className='card-face card-front';front.innerHTML=makeFrontHTML(p);
      flipper.appendChild(back);flipper.appendChild(front);scene.appendChild(flipper);grid.appendChild(scene);
      scene.addEventListener('animationend',(e)=>{
        if(e.animationName==='cardEntrance'){
          scene.style.opacity='1';scene.style.animation='none';
          
        }
      },{once:true});
      scene.addEventListener('click',(e)=>{
        if(e.target.closest('.fr-link'))return;
        if(popupLocked)return;
        openPopup(scene,i);
      });
      scene.addEventListener('keydown',(e)=>{if((e.key==='Enter'||e.key===' ')&&e.target===scene){e.preventDefault();if(!popupLocked)openPopup(scene,i);}});
    });

    // Shuffle & draw: riffle the deck, then pull a random project card (never the same one twice in a row).
    (function(){
      const deck=document.getElementById('deck'),scenes=[...document.querySelectorAll('#memoryGrid .card-scene')];
      const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
      let last=-1,busy=false;
      deck.addEventListener('click',()=>{
        if(busy||popupLocked)return; busy=true;
        let i; do{i=Math.floor(Math.random()*scenes.length);}while(scenes.length>1&&i===last); last=i;
        deck.classList.remove('shuffling'); void deck.offsetWidth; deck.classList.add('shuffling');
        scenes.forEach(s=>s.classList.remove('drawn'));
        setTimeout(()=>{deck.classList.remove('shuffling');scenes[i].classList.add('drawn');openPopup(scenes[i],i);busy=false;},still?0:750);
      });
    })();
  </script>
  <script type="module">
    import('https://unpkg.com/three@0.161.0/build/three.module.js').then(THREE=>{
      const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
      renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
      renderer.setSize(window.innerWidth,window.innerHeight);
      renderer.setClearColor(0x060d18,1);
      document.body.appendChild(renderer.domElement);
      const scene=new THREE.Scene();
      const camera=new THREE.PerspectiveCamera(36,window.innerWidth/window.innerHeight,0.1,500);
      camera.position.set(0,0,46);camera.lookAt(0,0,0);
      window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});
      const N=7000,pos=new Float32Array(N*3),ph=new Float32Array(N),sp=new Float32Array(N),sz=new Float32Array(N);
      for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*220;pos[i*3+1]=(Math.random()-.5)*160;pos[i*3+2]=-Math.random()*260;ph[i]=Math.random()*Math.PI*2;sp[i]=.002+Math.random()*.005;sz[i]=.1+Math.random()*.2;}
      const geo=new THREE.BufferGeometry();
      geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
      geo.setAttribute('phase',new THREE.BufferAttribute(ph,1));
      geo.setAttribute('speed',new THREE.BufferAttribute(sp,1));
      geo.setAttribute('aSize',new THREE.BufferAttribute(sz,1));
      const mat=new THREE.ShaderMaterial({uniforms:{time:{value:0}},vertexShader:`attribute float aSize;attribute float phase;attribute float speed;uniform float time;varying float vB;void main(){float r=abs(sin(time*speed+phase));vB=.7+.3*pow(r,.3);vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=aSize*(1.+2.*max(0.,r-.75)/.25)*(300./-mv.z);gl_Position=projectionMatrix*mv;}`,fragmentShader:`varying float vB;void main(){vec2 uv=gl_PointCoord-vec2(.5);if(length(uv)>.5)discard;float c=1.-smoothstep(0.,.45,length(uv));gl_FragColor=vec4(vec3(.75,.88,1.)*vB,c*vB);}`,transparent:true,depthWrite:false});
      scene.add(new THREE.Points(geo,mat));
      (function loop(t){requestAnimationFrame(loop);mat.uniforms.time.value=t*.001;renderer.render(scene,camera);})(0);
    });
  </script>
