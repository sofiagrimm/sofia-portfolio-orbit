<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flip book | Sofia Grimm</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&family=Cherry+Bomb+One&family=Inter:wght@300;400;500;600;700;800&family=Reenie+Beanie&display=swap">
<style>
  :root{--desk:#efe3e1;--desk2:#dfe5d2;--paper:#fbf7f1;--ink:#3a2e2c;--pink:#d9939f;--sage:#8f9f74;--edge:#e7ddd0}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Inter',Helvetica,Arial,sans-serif;color:var(--ink);
    background:radial-gradient(ellipse 70% 60% at 30% 20%,#f6e7e6 0%,transparent 70%),radial-gradient(ellipse 70% 60% at 80% 90%,var(--desk2) 0%,transparent 70%),var(--desk)}

  header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;padding:18px clamp(16px,4vw,44px)}
  header a{color:var(--ink);text-decoration:none;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.65}
  header a:hover,header a:focus-visible,header a[aria-current]{opacity:1;text-decoration:underline;text-underline-offset:4px}
  header .brand{font-family:'Inter',serif;font-style:italic;font-size:24px;letter-spacing:0;text-transform:none;opacity:1}
  header nav{display:flex;flex-wrap:wrap;gap:4px 14px}

  main{position:fixed;inset:0;display:grid;place-items:center;padding:96px 16px 92px}
  /* the book: a loose stack of pages; each one leaves from a different edge or corner */
  #book{position:relative;height:min(calc(100vh - 200px),calc((100vw - 32px) * 1.25),860px);aspect-ratio:4/5;perspective:2200px;cursor:pointer;outline:none}
  #book:focus-visible{box-shadow:0 0 0 3px var(--sage);border-radius:6px}
  .under{position:absolute;inset:0;background:var(--paper);border-radius:4px;box-shadow:0 1px 0 var(--edge)}
  .under.u1{transform:translate(5px,6px) rotate(.6deg);background:#f4eee5}
  .under.u2{transform:translate(-4px,10px) rotate(-.8deg);background:#efe7dc;box-shadow:0 30px 60px rgba(70,40,40,.18)}
  .page{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
  .page[hidden]{display:none}
  .face{position:absolute;inset:0;border-radius:4px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);
    box-shadow:0 1px 2px rgba(60,40,40,.15)}
  .face img{display:block;width:100%;height:100%;object-fit:cover}
  .face.fit img{object-fit:contain;background:#fff}
  .back{background:#f3ece2 repeating-linear-gradient(0deg,transparent 0 27px,rgba(143,159,116,.18) 27px 28px)}
  .shade{position:absolute;inset:0;pointer-events:none;opacity:0;background:rgba(40,25,25,.5)}
  .face .shine{position:absolute;inset:0;pointer-events:none;opacity:0}

  /* the corner or edge you'll turn next, lifted a little */
  .ear{position:absolute;z-index:3;pointer-events:none;transition:opacity .3s}
  .ear.corner{width:44px;height:44px;background:linear-gradient(135deg,#efe6d9 0 50%,transparent 50%);filter:drop-shadow(-2px -2px 3px rgba(60,40,40,.25))}
  .ear.edge{background:linear-gradient(var(--g),rgba(60,40,40,.18),transparent)}
  .page.going .ear{opacity:0}

  /* cover and the last page */
  .cover{display:flex;flex-direction:column;justify-content:space-between;padding:9% 9% 8%;background:
      radial-gradient(circle at 78% 22%,rgba(217,147,159,.35) 0 18%,transparent 19%),
      radial-gradient(circle at 18% 84%,rgba(143,159,116,.3) 0 14%,transparent 15%),var(--paper)}
  .cover small{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--sage)}
  .cover h1{font-family:'Cherry Bomb One',cursive;font-weight:300;font-size:clamp(46px,9vh,92px);line-height:.92;letter-spacing:-.02em}
  .cover h1 em{font-style:italic;font-weight:500;color:var(--pink)}
  .cover p{font-family:'Inter',serif;font-style:italic;font-size:clamp(15px,2.1vh,19px);max-width:22ch;line-height:1.35}
  .compass{width:74px;height:74px;align-self:flex-end}
  .end{justify-content:center;align-items:center;text-align:center;gap:18px}
  .end h1{font-size:clamp(38px,7vh,70px)}

  /* controls */
  .bar{position:fixed;left:0;right:0;bottom:22px;z-index:40;display:flex;justify-content:center;align-items:center;gap:18px}
  .bar button{font:500 11px 'Inter';letter-spacing:.18em;text-transform:uppercase;color:var(--ink);background:rgba(251,247,241,.85);border:1px solid rgba(58,46,44,.25);
    border-radius:999px;padding:10px 16px;cursor:pointer}
  .bar button:hover,.bar button:focus-visible{border-color:var(--ink);outline:none}
  .bar button:disabled{opacity:.35;cursor:default}
  .count{font-family:'Inter',serif;font-style:italic;font-size:17px;min-width:9ch;text-align:center}
  .count .from{display:block;font:500 10px 'Inter';font-style:normal;letter-spacing:.2em;text-transform:uppercase;color:var(--sage);margin-top:2px}

  @media (max-width:760px){main{padding-top:120px}header nav{gap:4px 10px}header a{font-size:11px}}

  /* template pages: each one is drawn as an SVG at the size of the image it was copied from */
  .tplface{background:#fff}
  .tplface svg.tpl{position:absolute;inset:0;width:100%;height:100%;display:block}
  .tpl text{white-space:pre}
  .para{white-space:pre-wrap;word-break:break-word}

  /* the editor */
  #panel{display:none}
  body.editing main{right:min(380px,42vw)}
  body.editing header{right:min(380px,42vw)}
  body.editing .bar{right:min(380px,42vw)}
  body.editing #book{cursor:default}
  body.editing #panel{display:flex;flex-direction:column;position:fixed;top:0;right:0;bottom:0;width:min(380px,42vw);z-index:60;background:#fffdf9;border-left:1px solid rgba(58,46,44,.15);
    overflow-y:auto;padding:22px 20px 0;font-size:13px;box-shadow:-20px 0 40px rgba(70,40,40,.08)}
  #panel .ph b{display:block;font-family:'Cherry Bomb One',cursive;font-weight:400;font-size:24px}
  #panel .ph span{display:block;color:#7a6d68;margin-top:4px;line-height:1.4}
  #panel h3{font:600 11px 'Inter';letter-spacing:.18em;text-transform:uppercase;color:var(--sage);margin:22px 0 8px}
  #panel .fld{margin:0 0 12px}
  #panel .fld label{display:block;font-weight:500;margin-bottom:4px}
  #panel .fld label em{font-style:normal;font:600 9px 'Inter';letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--pink);border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:2px}
  #panel input:not([type]),#panel textarea{width:100%;font:14px 'Inter';color:var(--ink);background:#fff;border:1px solid rgba(58,46,44,.22);border-radius:8px;padding:8px 10px}
  #panel input:focus,#panel textarea:focus{outline:2px solid var(--sage);outline-offset:1px}
  #panel .img{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;padding:10px;border:1px solid rgba(58,46,44,.12);border-radius:10px}
  #panel .img img{width:64px;height:64px;object-fit:cover;border-radius:6px;background:#f3ede6}
  #panel .img small{display:block;color:#8a7d78;margin-top:6px;line-height:1.35}
  #panel input[type=range]{width:100%;margin-top:8px;accent-color:var(--pink)}
  #panel .row{display:flex;gap:8px;flex-wrap:wrap}
  #panel .btn{display:inline-block;font:500 11px 'Inter';letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:#fff;border:1px solid rgba(58,46,44,.3);border-radius:999px;padding:7px 12px;cursor:pointer}
  #panel .btn:hover,#panel .btn:focus-within,#panel .btn:focus-visible{border-color:var(--ink);outline:none}
  #panel .btn.main{width:100%;background:var(--ink);color:#fff;padding:11px;border-color:var(--ink)}
  #panel .btn.main:disabled{opacity:.5}
  #panel .btn.quiet{border-color:transparent;text-decoration:underline;text-underline-offset:3px;padding-left:0}
  #panel .pf{position:sticky;bottom:0;margin-top:auto;background:linear-gradient(transparent,#fffdf9 18px);padding:22px 0 18px}
  #panel #pstatus{min-height:1.2em;color:#7a6d68;margin-bottom:8px;line-height:1.35}
  .tpl .hot{fill:transparent;stroke:rgba(217,147,159,.0);stroke-width:2;cursor:grab}
  .tpl .slot:hover .hot{stroke:rgba(217,147,159,.9)}
  body.editing .tpl .tx{cursor:text}
  @media (max-width:760px){
    body.editing main{right:0;bottom:46vh;padding-bottom:70px}
    body.editing .bar{right:0;bottom:calc(46vh + 10px)}
    body.editing #panel{top:auto;left:0;width:auto;height:46vh;border-left:0;border-top:1px solid rgba(58,46,44,.15)}
    body.editing #book{height:min(calc(54vh - 190px),calc((100vw - 32px) * 1.25))}
  }
  /* the logo keeps its original look: light, spaced, italic Cormorant Garamond */
  .nav-name,header .brand,.site>a:first-child{font-family:'Cormorant Garamond',Georgia,serif !important;font-weight:300 !important;font-style:italic !important;letter-spacing:.06em !important}
</style>

  const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const natural = {};
  const sizeOf = src => natural[src] ? Promise.resolve(natural[src]) : new Promise(res => { const im = new Image(); im.onload = () => res(natural[src] = [im.naturalWidth, im.naturalHeight]); im.onerror = () => res([1, 1]); im.src = src; });

  function starPoints(cx, cy, r, rot, ratio) {
    const p = [];
    for (let k = 0; k < 10; k++) {
      const a = (rot - 90 + k * 36) * Math.PI / 180, rr = k % 2 ? r * ratio : r;
      p.push((cx + rr * Math.cos(a)).toFixed(1) + ',' + (cy + rr * Math.sin(a)).toFixed(1));
    }
    return p.join(' ');
  }

  // place a picture inside its box: cover crops to fill, contain fits; zoom and pan are kept per picture
  async function placeImage(img, it, pic) {
    const [x0, y0, x1, y1] = it.box, bw = x1 - x0, bh = y1 - y0;
    const src = pic ? pic.src : it.src;
    img.setAttribute('href', src);
    if (it.kind === 'cutout' || it.fit === 'contain') {
      img.setAttribute('x', x0); img.setAttribute('y', y0); img.setAttribute('width', bw); img.setAttribute('height', bh);
      img.setAttribute('preserveAspectRatio', it.kind === 'cutout' && it.people ? 'xMidYMax meet' : 'xMidYMid meet');
      return;
    }
    const [nw, nh] = await sizeOf(src);
    const z = pic && pic.z ? pic.z : 1;
    const s = Math.max(bw / nw, bh / nh) * z, w = nw * s, h = nh * s;
    const px = pic && pic.x != null ? pic.x : 0, py = pic && pic.y != null ? pic.y : 0;
    img.setAttribute('x', (x0 + (bw - w) / 2 + px * (w - bw) / 2).toFixed(2));
    img.setAttribute('y', (y0 + (bh - h) / 2 + py * (h - bh) / 2).toFixed(2));
    img.setAttribute('width', w.toFixed(2)); img.setAttribute('height', h.toFixed(2));
    img.setAttribute('preserveAspectRatio', 'none');
  }

  function renderTemplate(face, t) {
    face.innerHTML = '';
    const svg = el('svg', {viewBox: `0 0 ${t.w} ${t.h}`, preserveAspectRatio: 'xMidYMid meet', class: 'tpl', role: 'img', 'aria-label': t.title});
    face.appendChild(svg);
    const defs = el('defs', {}, svg);
    const f = el('filter', {id: `stk-${t.key}`, x: '-10%', y: '-10%', width: '120%', height: '120%'}, defs);
    el('feMorphology', {in: 'SourceAlpha', operator: 'dilate', radius: '4', result: 'd'}, f);
    el('feFlood', {'flood-color': '#fbf8f2', result: 'w'}, f);
    el('feComposite', {in: 'w', in2: 'd', operator: 'in', result: 'o'}, f);
    el('feDropShadow', {in: 'o', dx: '1', dy: '2', stdDeviation: '2', 'flood-opacity': '.25', result: 'os'}, f);
    const m = el('feMerge', {}, f); el('feMergeNode', {in: 'os'}, m); el('feMergeNode', {in: 'SourceGraphic'}, m);
    el('image', {href: t.bg, x: 0, y: 0, width: t.w, height: t.h, preserveAspectRatio: 'none'}, svg);
    for (const it of t.items) {
      if (it.type === 'slot') {
        const [x0, y0, x1, y1] = it.box, pic = imgOf(t.key, it);
        const g = el('g', {class: 'slot', 'data-key': it.key}, svg);
        if (it.kind !== 'cutout') {
          const cp = el('clipPath', {id: `c-${t.key}-${it.key}`}, defs);
          el('rect', {x: x0, y: y0, width: x1 - x0, height: y1 - y0, rx: it.radius || 0}, cp);
          g.setAttribute('clip-path', `url(#c-${t.key}-${it.key})`);
          if (it.fill) el('rect', {x: x0, y: y0, width: x1 - x0, height: y1 - y0, fill: it.fill}, g);
        }
        const img = el('image', {}, g);
        if (it.sticker && pic) img.setAttribute('filter', `url(#stk-${t.key})`);
        placeImage(img, it, pic);
        if (EDIT) { el('rect', {x: x0, y: y0, width: x1 - x0, height: y1 - y0, class: 'hot'}, g); }
      } else if (it.type === 'star') {
        el('polygon', {points: starPoints(it.cx, it.cy, it.r, it.rot, it.ratio), fill: it.color}, svg);
      } else if (it.type === 'rect') {
        const [x0, y0, x1, y1] = it.box; el('rect', {x: x0, y: y0, width: x1 - x0, height: y1 - y0, fill: it.color}, svg);
      } else if (it.type === 'circle') {
        el('circle', {cx: it.cx, cy: it.cy, r: it.r, fill: it.color}, svg);
      } else if (it.type === 'text') {
        const [x0, y0, x1, y1] = it.box, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
        const mid = it.anchor === 'middle';
        const tx = el('text', {
          transform: `translate(${cx} ${cy}) rotate(${it.rot}) translate(${mid ? 0 : it.start} ${it.base}) scale(${it.sx} 1)`,
          'font-size': it.size, 'font-weight': it.weight, 'font-style': it.style, fill: it.color,
          'text-anchor': mid ? 'middle' : 'start', 'letter-spacing': (it.ls * it.size).toFixed(2), class: 'tx', 'data-key': it.key,
        }, svg);
        tx.style.fontFamily = it.family;
        tx.textContent = textOf(t.key, it);
      } else if (it.type === 'para') {
        const [x0, y0, x1, y1] = it.box;
        const fo = el('foreignObject', {x: x0, y: y0, width: x1 - x0, height: y1 - y0 + 30}, svg);
        const d = document.createElement('div');
        d.className = 'para'; d.dataset.key = it.key;
        Object.assign(d.style, {fontFamily: it.family, fontSize: it.size + 'px', lineHeight: it.lh, fontWeight: it.weight, color: it.color});
        d.textContent = textOf(t.key, it);
        fo.appendChild(d);
      }
    }
    if (EDIT) wireEditing(svg, t);
  }

  const els = PAGES.map((p, i) => {
    const page = document.createElement('div');
    page.className = 'page';
    let front;
    if (p.cover) front = `<div class="face front cover"><small>a flip book</small>
        <h1>turn it<br><em>any</em><br>which way</h1>
        <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px"><p>Every page leaves from a different side. Top, bottom, left, right, and all four corners.</p>${compass}</div></div>`;
    else if (p.end) front = `<div class="face front cover end"><small>the last page</small><h1>that's the<br><em>whole</em> book</h1><p>Turn once more to start over.</p>${compass}</div>`;
    else front = `<div class="face front tplface"></div>`;
    page.innerHTML = front + '<div class="face back"></div><div class="shade"></div>';
    page.querySelector('.front').insertAdjacentHTML('beforeend', '<div class="shine"></div>');
    book.appendChild(page);
    return page;
  });
  function renderAll() {
    content = merged();
    PAGES.forEach((p, k) => { if (p.tpl) { const f = els[k].querySelector('.front'); const sh = f.querySelector('.shine'); renderTemplate(f, p.tpl); f.appendChild(sh); } });
  }
  function renderOne(k) {
    content = merged();
    const f = els[k].querySelector('.front'), sh = f.querySelector('.shine');
    renderTemplate(f, PAGES[k].tpl); f.appendChild(sh);
  }

  // ── turning ──
  function ear(page, d) {
    page.querySelectorAll('.ear').forEach(e => e.remove());
    const e = document.createElement('div');
    if (d.x && d.y) {
      e.className = 'ear corner';
      e.style[d.x > 0 ? 'right' : 'left'] = '0'; e.style[d.y > 0 ? 'bottom' : 'top'] = '0';
      e.style.transform = `rotate(${d.x > 0 ? (d.y > 0 ? 0 : 90) : (d.y > 0 ? 270 : 180)}deg)`;
    } else {
      e.className = 'ear edge';
      Object.assign(e.style, d.x ? {top: 0, bottom: 0, width: '22px'} : {left: 0, right: 0, height: '22px'});
      e.style[d.x > 0 ? 'right' : d.x < 0 ? 'left' : d.y > 0 ? 'bottom' : 'top'] = '0';
      e.style.setProperty('--g', d.x > 0 ? 'to left' : d.x < 0 ? 'to right' : d.y > 0 ? 'to top' : 'to bottom');
    }
    page.appendChild(e);
  }
  const hinge = d => `${50 - d.x * 50}% ${50 - d.y * 50}%`;
  const axis = d => `${-d.y},${d.x},0`;
  let i = 0, busy = false;
  const num = document.getElementById('num'), from = document.getElementById('from');
  const prevBtn = document.getElementById('prev'), nextBtn = document.getElementById('next');
  function layout() {
    els.forEach((e, k) => {
      e.hidden = k < i; e.style.zIndex = String(100 - k); e.style.transform = '';
      e.querySelector('.back').style.transform = `rotate3d(${axis(dirFor(k))},180deg)`;
    });
    ear(els[i], dirFor(i));
    num.textContent = `${i + 1} / ${els.length}`;
    from.textContent = i === els.length - 1 ? 'back to the start' : `from ${dirFor(i).name}`;
    prevBtn.disabled = i === 0;
    if (EDIT) panelFor(i);
  }
  function animate(e, d, out) {
    const ax = axis(d), a0 = out ? 0 : -180, a1 = out ? -180 : 0, dur = still ? 1 : 950, ease = 'cubic-bezier(.45,.05,.25,1)';
    e.style.transformOrigin = hinge(d);
    e.querySelector('.back').style.transform = `rotate3d(${ax},180deg)`;
    e.classList.add('going'); e.style.zIndex = '200';
    const turn = e.animate([{transform: `rotate3d(${ax},${a0}deg)`}, {transform: `rotate3d(${ax},${(a0 + a1) / 2}deg) translateZ(40px)`}, {transform: `rotate3d(${ax},${a1}deg)`}], {duration: dur, easing: ease, fill: 'forwards'});
    const sh = e.querySelector('.shine');
    sh.style.background = `linear-gradient(${Math.atan2(d.y, d.x) * 180 / Math.PI + 90}deg,rgba(255,255,255,0),rgba(255,255,255,.35),rgba(60,30,30,.25))`;
    sh.animate([{opacity: 0}, {opacity: 1}, {opacity: 0}], {duration: dur, easing: ease});
    const below = out ? els[i + 1] : els[i];
    if (below && !still) below.querySelector('.shade').animate(out ? [{opacity: .55}, {opacity: 0}] : [{opacity: 0}, {opacity: .55}], {duration: dur, easing: ease});
    return turn.finished.then(() => { turn.cancel(); e.classList.remove('going'); });
  }
  async function next() {
    if (busy) return;
    if (i === els.length - 1) { busy = true; i = 0; layout(); if (!still) els[0].animate([{opacity: 0, transform: 'translateY(14px)'}, {opacity: 1, transform: 'none'}], {duration: 500, easing: 'ease-out'}); busy = false; return; }
    busy = true; await animate(els[i], dirFor(i), true); i++; layout(); busy = false;
  }
  async function prev() {
    if (busy || i === 0) return;
    busy = true; i--; els[i].hidden = false; els[i + 1].querySelectorAll('.ear').forEach(e => e.remove());
    await animate(els[i], dirFor(i), false); layout(); busy = false;
  }
  book.addEventListener('click', () => { if (!EDIT) next(); });
  nextBtn.addEventListener('click', next);
  prevBtn.addEventListener('click', prev);
  book.addEventListener('keydown', e => {
    if (e.target !== book) return;
    if (['ArrowRight', 'ArrowDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); next(); }
    if (['ArrowLeft', 'ArrowUp'].includes(e.key)) { e.preventDefault(); prev(); }
  });
  addEventListener('keydown', e => {
    if (e.target === book || /^(BUTTON|INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight') next(); if (e.key === 'ArrowLeft') prev();
  });

  // ── editing (flipbook.html?edit) ──
  const panel = document.getElementById('panel');
  const saveDraft = () => { try { localStorage.setItem('flipbook-draft', JSON.stringify(draft)); status(''); } catch (e) { status('This browser is out of room for drafts. Publish, or use smaller pictures.'); } };
  const status = msg => { const s = document.getElementById('pstatus'); if (s) s.textContent = msg; };
  const dslot = pk => (draft[pk] = draft[pk] || {t: {}, i: {}});

  function shrink(file, keepAlpha) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file), im = new Image();
      im.onload = () => {
        const max = 1400, k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
        const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        let d = c.toDataURL('image/webp', .88);
        if (!d.startsWith('data:image/webp')) d = keepAlpha ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', .88);
        res(d);
      };
      im.onerror = () => rej(new Error('That file could not be read as a picture.'));
      im.src = url;
    });
  }

  function panelFor(k) {
    if (!panel) return;
    const p = PAGES[k];
    if (!p.tpl) {
      panel.innerHTML = `<div class="ph"><b>Editing</b><span>Turn to a page to change its words and pictures.</span></div>${footer()}`;
      wireFooter(); return;
    }
    const t = p.tpl, pk = t.key;
    let h = `<div class="ph"><b>${t.title}</b><span>Changes save as a draft in this browser. Publish to put them on the site.</span></div>`;
    h += '<h3>Pictures</h3>';
    for (const it of t.items.filter(x => x.type === 'slot')) {
      const pic = imgOf(pk, it), src = pic ? pic.src : it.src;
      h += `<div class="fld img" data-key="${it.key}"><img src="${src}" alt=""><div><label>${it.label}${it.people ? ' <em>person</em>' : ''}</label>
        <div class="row"><label class="btn">replace<input type="file" accept="image/*" data-up="${it.key}" hidden></label>${pic ? `<button type="button" class="btn" data-reset="${it.key}">reset</button>` : ''}</div>
        ${it.kind === 'cutout' ? '<small>Use a picture with a see-through background (on iPhone, press and hold a photo, then copy the subject).</small>' : (it.fit === 'contain' ? '' : `<input type="range" min="1" max="3" step=".01" value="${pic && pic.z || 1}" data-zoom="${it.key}" aria-label="Zoom ${it.label}"><small>Drag the picture on the page to move it.</small>`)}
        </div></div>`;
    }
    h += '<h3>Words</h3>';
    for (const it of t.items.filter(x => x.type === 'text' || x.type === 'para')) {
      const v = textOf(pk, it).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
      h += `<div class="fld"><label for="f-${pk}-${it.key}">${it.label}</label>${it.type === 'para'
        ? `<textarea id="f-${pk}-${it.key}" data-text="${it.key}" rows="4">${v}</textarea>`
        : `<input id="f-${pk}-${it.key}" data-text="${it.key}" value="${v}">`}</div>`;
    }
    h += `<button type="button" class="btn quiet" data-resetpage>put this page back the way it was</button>`;
    panel.innerHTML = h + footer();
    panel.querySelectorAll('[data-text]').forEach(inp => inp.addEventListener('input', () => {
      const it = t.items.find(x => x.key === inp.dataset.text);
      dslot(pk).t[it.key] = inp.value; saveDraft(); content = merged();
      const node = els[k].querySelector(`[data-key="${it.key}"].tx, .para[data-key="${it.key}"]`);
      if (node) node.textContent = inp.value;
    }));
    panel.querySelectorAll('[data-up]').forEach(inp => inp.addEventListener('change', async () => {
      const f = inp.files[0]; if (!f) return;
      const it = t.items.find(x => x.key === inp.dataset.up);
      status('Reading the picture…');
      try { dslot(pk).i[it.key] = {src: await shrink(f, it.kind === 'cutout'), z: 1, x: 0, y: 0}; saveDraft(); renderOne(k); panelFor(k); }
      catch (e) { status(e.message); }
    }));
    panel.querySelectorAll('[data-reset]').forEach(b => b.addEventListener('click', () => {
      dslot(pk).i[b.dataset.reset] = null; saveDraft(); renderOne(k); panelFor(k);
    }));
    panel.querySelectorAll('[data-zoom]').forEach(r => r.addEventListener('input', () => {
      const it = t.items.find(x => x.key === r.dataset.zoom);
      const cur = imgOf(pk, it) || {src: it.src};
      dslot(pk).i[it.key] = Object.assign({}, cur, {z: +r.value}); saveDraft(); content = merged();
      placeImage(els[k].querySelector(`.slot[data-key="${it.key}"] image`), it, dslot(pk).i[it.key]);
    }));
    panel.querySelector('[data-resetpage]').addEventListener('click', () => {
      if (!confirm('Put this page back to the original words and pictures? (Published changes stay until you publish again.)')) return;
      draft[pk] = {t: {}, i: {}};
      t.items.forEach(it => { if (it.type === 'slot') draft[pk].i[it.key] = null; else if (it.type === 'text' || it.type === 'para') draft[pk].t[it.key] = it.text; });
      saveDraft(); renderOne(k); panelFor(k);
    });
    wireFooter();
  }
  function footer() {
    return `<div class="pf"><p id="pstatus" role="status"></p>
      <button type="button" class="btn main" id="publish">publish to the site</button>
      <div class="row"><button type="button" class="btn quiet" id="backup">download a backup</button><button type="button" class="btn quiet" id="discard">discard draft</button></div></div>`;
  }
  function wireFooter() {
    document.getElementById('publish').onclick = publish;
    document.getElementById('discard').onclick = () => { if (confirm('Throw away the unpublished changes in this browser?')) { draft = {}; saveDraft(); renderAll(); layout(); } };
    document.getElementById('backup').onclick = () => {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(merged(), null, 1)], {type: 'application/json'}));
      a.download = 'flipbook-content.json'; a.click();
    };
  }

  // drag a picture inside its frame to choose what shows; click words on the page to jump to their box
  function wireEditing(svg, t) {
    const k = PAGES.findIndex(p => p.tpl === t);
    svg.querySelectorAll('.tx').forEach(n => n.addEventListener('click', () => { const f = document.getElementById(`f-${t.key}-${n.dataset.key}`); if (f) { f.focus(); f.select(); } }));
    svg.querySelectorAll('.slot').forEach(g => {
      const it = t.items.find(x => x.key === g.dataset.key);
      if (it.kind === 'cutout' || it.fit === 'contain') return;
      g.addEventListener('pointerdown', e => {
        const pic = imgOf(t.key, it); if (!pic && !it.src) return;
        e.preventDefault(); g.setPointerCapture(e.pointerId);
        const r = svg.getBoundingClientRect(), scale = t.w / r.width;
        const img = g.querySelector('image'), start = {x: e.clientX, y: e.clientY}, base = Object.assign({src: it.src, z: 1, x: 0, y: 0}, pic || {});
        const w = +img.getAttribute('width'), h = +img.getAttribute('height'), [x0, y0, x1, y1] = it.box;
        const mv = ev => {
          const dx = (ev.clientX - start.x) * scale, dy = (ev.clientY - start.y) * scale;
          const nx = w > x1 - x0 ? Math.max(-1, Math.min(1, base.x + dx * 2 / (w - (x1 - x0)))) : 0;
          const ny = h > y1 - y0 ? Math.max(-1, Math.min(1, base.y + dy * 2 / (h - (y1 - y0)))) : 0;
          dslot(t.key).i[it.key] = Object.assign({}, base, {x: nx, y: ny}); content = merged();
          placeImage(img, it, dslot(t.key).i[it.key]);
        };
        const up = () => { g.removeEventListener('pointermove', mv); g.removeEventListener('pointerup', up); saveDraft(); };
        g.addEventListener('pointermove', mv); g.addEventListener('pointerup', up);
      });
    });
  }

  // ── publishing: commit the pictures and the words to GitHub; the site redeploys from there ──
  async function gh(path, opts = {}) {
    const tok = localStorage.getItem('flipbook-gh');
    return fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, Object.assign({headers: {Authorization: `Bearer ${tok}`, Accept: 'application/vnd.github+json'}}, opts));
  }
  async function sha8(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].slice(0, 4).map(x => x.toString(16).padStart(2, '0')).join(''); }
  async function publish() {
    let tok = localStorage.getItem('flipbook-gh');
    if (!tok) {
      tok = prompt('Paste a GitHub token that can write to sofia-portfolio-orbit (fine-grained, Contents: read and write). It stays in this browser only.');
      if (!tok) return; localStorage.setItem('flipbook-gh', tok.trim());
    }
    const btn = document.getElementById('publish'); btn.disabled = true;
    try {
      const out = merged();
      for (const [pk, pv] of Object.entries(out)) {
        for (const [key, pic] of Object.entries(pv.i || {})) {
          if (!pic) { delete pv.i[key]; continue; }
          if (!pic.src.startsWith('data:')) continue;
          const [meta, b64] = pic.src.split(','), ext = meta.includes('webp') ? 'webp' : meta.includes('png') ? 'png' : 'jpg';
          const path = `lab/img/flipbook/u/${pk}-${key}-${await sha8(b64)}.${ext}`;
          status(`Uploading ${pk} / ${key}…`);
          const exists = await gh(path);
          if (exists.status === 404) {
            const r = await gh(path, {method: 'PUT', body: JSON.stringify({message: `Flip book: picture for ${pk} / ${key}`, content: b64, branch: BRANCH})});
            if (!r.ok) throw new Error(`GitHub said ${r.status} while uploading a picture.`);
          }
          pic.src = path.replace(/^lab\//, '');
        }
      }
      status('Saving the words…');
      const cur = await gh(CONTENT), body = {message: 'Flip book: update pages', branch: BRANCH,
        content: btoa(unescape(encodeURIComponent(JSON.stringify(out, null, 1))))};
      if (cur.ok) body.sha = (await cur.json()).sha;
      const r = await gh(CONTENT, {method: 'PUT', body: JSON.stringify(body)});
      if (r.status === 401 || r.status === 403) { localStorage.removeItem('flipbook-gh'); throw new Error('GitHub turned the token down. Try publishing again with a new one.'); }
      if (!r.ok) throw new Error(`GitHub said ${r.status}.`);
      published = out; draft = {}; saveDraft(); renderAll(); layout();
      status('Published. The site picks it up in a minute or two, once it redeploys.');
    } catch (e) { status(e.message || 'Publishing did not work.'); }
    btn.disabled = false;
  }

  // ── start ──
  if (EDIT) document.body.classList.add('editing');
  fetch('flipbook-content.json', {cache: 'no-store'}).then(r => r.ok ? r.json() : {}).catch(() => ({})).then(j => {
    published = j || {}; renderAll(); layout();
  });
  renderAll(); layout();
})();

</script>
</body>
</html>
