<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arts | Sofia Grimm</title>
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Inter:wght@300;400;500&family=Cormorant+Garamond:ital,wght@1,500&display=swap">
<style>
  :root{--sun:#f2c75c;--ink:#2a2219;--glass:rgba(255,255,255,.16);--edge:rgba(255,255,255,.35)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{overflow-x:clip}
  body{min-height:100vh;background:var(--sun);font-family:'Inter',Helvetica,Arial,sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center}
  /* the Vitruvian sketch, faint behind everything */
  .sketch{position:fixed;inset:0;background:url('https://commons.wikimedia.org/wiki/Special:FilePath/Da_Vinci_Vitruve_Luc_Viatour.jpg?width=1400') center/min(95vh,1000px) no-repeat;
    opacity:.16;mix-blend-mode:multiply;pointer-events:none;filter:sepia(.6) contrast(1.2)}
  .site{position:relative;z-index:2;width:100%;display:flex;justify-content:space-between;align-items:baseline;padding:22px clamp(18px,4vw,48px) 0;color:var(--ink);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
  .site a{color:var(--ink);text-decoration:none;opacity:.7}.site a:hover,.site a:focus-visible{opacity:1}
  .site nav{display:flex;flex-wrap:wrap;gap:4px 18px}

  .hero{position:relative;z-index:2;width:min(1180px,92vw);height:min(720px,calc(100vh - 120px));min-height:520px;margin:clamp(16px,4vh,40px) 0 60px;border-radius:26px;overflow:hidden;
    box-shadow:0 40px 80px rgba(80,50,0,.35),0 8px 18px rgba(80,50,0,.25);cursor:none;isolation:isolate}
  .canvas{position:absolute;inset:-4%;background-size:cover;background-position:center 30%;transition:filter .6s,transform .9s cubic-bezier(.2,.8,.2,1),opacity .6s;will-change:transform}
  .canvas.fade{opacity:0}
  .hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 22%,transparent 50%,rgba(0,0,0,.6))}
  .hero.happy .canvas{filter:saturate(1.2) brightness(1.08) sepia(.08)}
  .hero.sad .canvas{filter:saturate(.35) brightness(.78) contrast(1.05)}
  .glow{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:0;transition:opacity .6s;background:radial-gradient(circle at 50% 35%,rgba(255,214,140,.35),transparent 55%)}
  .hero.happy .glow{opacity:1}
  .hero.sad.shake .canvas{animation:shake .45s}
  @keyframes shake{20%{translate:-6px 0}40%{translate:5px 0}60%{translate:-3px 0}80%{translate:2px 0}}

  .bar{position:absolute;z-index:3;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:22px 26px}
  .logo{font-family:'Pinyon Script',cursive;font-size:32px;line-height:1;color:#fff}
  .links{display:flex;gap:30px;font-size:13px;color:rgba(255,255,255,.85)}
  .links a,.pill{color:inherit;text-decoration:none}
  .pill{background:var(--glass);border:1px solid var(--edge);border-radius:999px;padding:8px 16px;font-size:13px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

  /* the two things you can offer her: glass cards that drift toward your cursor */
  .offer{position:absolute;z-index:3;width:clamp(120px,12vw,160px);aspect-ratio:1;border-radius:20px;background:var(--glass);border:1px solid var(--edge);
    backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    font-size:13px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.4);box-shadow:0 18px 36px rgba(0,0,0,.25);transition:background .3s,border-color .3s,scale .3s;will-change:transform}
  .offer span{display:block;padding:0 10px;text-align:center;line-height:1.25;font-size:12px}
  .offer svg{width:58%;height:auto;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
  .offer:hover,.offer:focus-visible{background:rgba(255,255,255,.26);border-color:rgba(255,255,255,.7);scale:1.05;outline:none}
  .offer.a{left:12%;top:28%}.offer.b{right:9%;top:36%}

  .copy{position:absolute;z-index:3;left:clamp(20px,3.4vw,44px);bottom:clamp(24px,5vh,46px);max-width:min(520px,80%)}
  .copy h1{font-family:'Pinyon Script',cursive;font-weight:400;font-size:clamp(52px,7vw,92px);line-height:.95;color:#f6ead2;text-shadow:0 4px 24px rgba(0,0,0,.45)}
  .copy p{margin-top:12px;font-size:14px;line-height:1.55;color:rgba(255,255,255,.88);max-width:44ch}
  .mood{display:block;margin-top:10px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;color:#ffe2a8;min-height:1.3em;transition:opacity .3s}
  .others{display:inline-flex;align-items:center;gap:10px;margin-top:16px;cursor:pointer}
  .others .faces{display:flex}
  .others .faces span{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.75);background-size:cover;background-position:center 25%;margin-left:-9px}
  .others .faces span:first-child{margin-left:0}
  .sig{position:absolute;z-index:3;right:clamp(20px,3vw,40px);bottom:clamp(24px,5vh,46px);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;color:#f6ead2}

  /* the cursor follower: a soft glass ring that trails the pointer and carries a word */
  .follower{position:absolute;z-index:5;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;pointer-events:none;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:grid;place-items:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#fff;transition:width .25s,height .25s,margin .25s,background .25s;will-change:transform}
  .follower.big{width:96px;height:96px;margin:-48px 0 0 -48px;background:rgba(255,255,255,.22)}
  .credit{position:relative;z-index:2;margin:-40px 0 30px;font-size:11px;color:rgba(42,34,25,.6);text-align:center;padding:0 20px}

  /* ── gallery of framed paintings ── */
  .gallery{position:relative;z-index:2;width:min(1100px,92vw);margin:10px 0 70px;text-align:center;color:var(--ink)}
  .gallery h2{font-family:'Pinyon Script',cursive;font-weight:400;font-size:clamp(46px,6vw,72px);line-height:1}
  .gal-sub{font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.65;margin-top:6px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,5vw,70px) clamp(24px,4vw,60px);margin-top:36px;align-items:center;justify-items:center}
  .framed{position:relative;width:100%;cursor:pointer;border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 26px 30px rgba(70,40,0,.35))}
  .framed:focus-visible{outline:3px solid #2a2219;outline-offset:8px}
  .framed .pic{position:absolute;overflow:hidden;background:#222}
  .framed .pic img{display:block;width:100%;height:100%;object-fit:fill}
  .framed .fbox{position:relative;width:100%}
  .framed .fimg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;z-index:2;-webkit-user-drag:none}
  .framed .pic{z-index:1}
  .framed .cap{display:block;margin-top:14px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;color:var(--ink)}
  .eye{position:absolute;background-repeat:no-repeat;pointer-events:none;-webkit-mask:radial-gradient(ellipse 50% 50% at 50% 50%,#000 45%,transparent 100%);mask:radial-gradient(ellipse 50% 50% at 50% 50%,#000 45%,transparent 100%)}
  .skyglow{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.9;background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,236,150,.5),rgba(255,220,120,.12) 12%,transparent 26%)}
  .eyemark{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#ff3b6b;border:2px solid #fff;cursor:move;z-index:9}
  @media (max-width:760px){.grid{grid-template-columns:1fr}}
  @media (max-width:760px){.links{display:none}.offer.a{left:6%;top:20%}.offer.b{right:6%;top:24%}.hero{cursor:auto}.follower{display:none}}
  @media (prefers-reduced-motion:reduce){.canvas,.offer{transition:none}.hero.sad.shake .canvas{animation:none}}
</style>
</head>

<script>
// ── the paintings and what each one would love, or hate, to be offered.
//    To show your own work, add entries here: img (any image path), title, blurb, signature,
//    and two offers (good = makes them happy, bad = upsets them) with a little drawing each.
const W = f => 'https://commons.wikimedia.org/wiki/Special:FilePath/' + f + '?width=1600';
const ICON = {
  pasta:`<svg viewBox="0 0 120 80"><g transform="rotate(-24 60 40)"><rect x="8" y="30" width="48" height="18" rx="4" fill="#e8b14d"/><rect x="66" y="28" width="46" height="18" rx="4" fill="#e8b14d"/>${[0,1,2,3,4].map(i=>`<path d="M${14+i*8} 30 v18 M${72+i*8} 28 v18" stroke="#c98a2a" stroke-width="2"/>`).join('')}<path d="M56 30 l4 6 l-3 4 l5 8 M66 28 l-3 7 l4 4 l-4 7" stroke="#fff3c9" stroke-width="2" fill="none"/></g><circle cx="62" cy="62" r="2" fill="#f2d28a"/><circle cx="70" cy="66" r="1.5" fill="#f2d28a"/><circle cx="56" cy="68" r="1.4" fill="#f2d28a"/></svg>`,
  tiramisu:`<svg viewBox="0 0 120 90"><ellipse cx="60" cy="74" rx="52" ry="10" fill="#f4f0e8"/><path d="M22 34 L60 22 L98 34 L98 66 L60 76 L22 66Z" fill="#f3e6cc"/><path d="M22 44 L60 54 L98 44 L98 50 L60 60 L22 50Z" fill="#7a4a26"/><path d="M22 58 L60 68 L98 58 L98 64 L60 74 L22 64Z" fill="#7a4a26"/><path d="M22 34 L60 46 L98 34 L60 22Z" fill="#5a331a"/>${[0,1,2,3,4,5,6].map(i=>`<circle cx="${34+i*8}" cy="${30+((i*7)%5)}" r="1.4" fill="#3a2010"/>`).join('')}</svg>`,
  pearl:`<svg viewBox="0 0 100 100"><path d="M50 10 C54 22 54 28 50 34" stroke="#d9c7a0" stroke-width="3" fill="none"/><circle cx="50" cy="60" r="26" fill="url(#pg)"/><defs><radialGradient id="pg" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#e6e1d6"/><stop offset="1" stop-color="#9f9789"/></radialGradient></defs><ellipse cx="41" cy="50" rx="7" ry="5" fill="#fff" opacity=".9"/></svg>`,
  milk:`<svg viewBox="0 0 110 90"><path d="M20 30 L44 26 L50 66 L28 70Z" fill="#cfe3ef" opacity=".85" transform="rotate(62 36 48)"/><path d="M38 60 C60 58 86 62 96 70 C82 76 50 76 34 70Z" fill="#fbfbf8"/><circle cx="92" cy="58" r="3" fill="#fbfbf8"/><circle cx="84" cy="50" r="2" fill="#fbfbf8"/></svg>`,
  telescope:`<svg viewBox="0 0 110 100"><g transform="rotate(-28 55 40)"><rect x="18" y="32" width="70" height="16" rx="3" fill="#c9a45a"/><rect x="82" y="29" width="14" height="22" rx="3" fill="#8a6a2c"/><rect x="10" y="35" width="10" height="10" fill="#8a6a2c"/></g><path d="M55 48 L36 92 M55 48 L55 94 M55 48 L74 92" stroke="#4a3a2a" stroke-width="4" stroke-linecap="round"/><circle cx="96" cy="10" r="3" fill="#fff6c8"/><circle cx="84" cy="4" r="2" fill="#fff6c8"/></svg>`,
  lamp:`<svg viewBox="0 0 100 100"><rect x="46" y="30" width="8" height="66" fill="#3a3a40"/><path d="M28 30 h44 l-8 -14 h-28z" fill="#3a3a40"/><ellipse cx="50" cy="34" rx="26" ry="8" fill="#ffe9a0"/><path d="M24 36 L6 96 H94 L76 36Z" fill="#ffe9a0" opacity=".35"/></svg>`,
  shell:`<svg viewBox="0 0 110 90"><path d="M55 80 C20 76 8 46 18 28 C28 12 82 12 92 28 C102 46 90 76 55 80Z" fill="#f4c9b8"/>${[-40,-24,-8,8,24,40].map(a=>`<path d="M55 78 L${55+Math.sin(a*Math.PI/180)*44} ${78-Math.cos(a*Math.PI/180)*60}" stroke="#d99a86" stroke-width="2.2"/>`).join('')}<path d="M44 80 h22 v6 h-22z" fill="#e9b3a1"/></svg>`,
  wind:`<svg viewBox="0 0 110 80"><path d="M10 30 H70 C86 30 86 10 72 12 M10 46 H88 C104 46 104 66 90 64 M18 60 H52" stroke="#e9f3f8" stroke-width="5" fill="none" stroke-linecap="round"/></svg>`
};
// little book, letter and scroll drawings for the offers
const BOOK=(c,t,sub)=>`<svg viewBox="0 0 110 120"><rect x="22" y="14" width="68" height="94" rx="4" fill="#000" opacity=".25" transform="translate(4 5)"/><rect x="22" y="14" width="68" height="94" rx="4" fill="${c}"/><rect x="22" y="14" width="10" height="94" fill="#000" opacity=".22"/><rect x="40" y="34" width="42" height="1.4" fill="#f3e3b8" opacity=".8"/><rect x="40" y="70" width="42" height="1.4" fill="#f3e3b8" opacity=".8"/><text x="61" y="52" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-style="italic" font-size="11" fill="#f6e7c2">${t}</text><text x="61" y="64" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-size="8" fill="#f6e7c2" opacity=".85">${sub}</text><rect x="86" y="18" width="4" height="86" fill="#efe6d2"/></svg>`;
ICON.letter=`<svg viewBox="0 0 120 100"><rect x="14" y="24" width="92" height="60" rx="4" fill="#000" opacity=".25" transform="translate(4 5)"/><rect x="14" y="24" width="92" height="60" rx="4" fill="#efe4cc"/><path d="M14 26 L60 58 L106 26" fill="none" stroke="#b9a37a" stroke-width="2"/><path d="M30 70 q8 -6 16 0 t16 0" stroke="#4a3a6a" stroke-width="1.6" fill="none"/><circle cx="88" cy="66" r="7" fill="#a33a2a"/><text x="88" y="69" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#f3d9c8">V</text></svg>`;
ICON.scroll=`<svg viewBox="0 0 120 100"><rect x="26" y="20" width="68" height="62" fill="#000" opacity=".25" transform="translate(4 5)"/><rect x="26" y="20" width="68" height="62" fill="#efe1c0"/><rect x="18" y="14" width="84" height="10" rx="5" fill="#c9a76a"/><rect x="18" y="78" width="84" height="10" rx="5" fill="#c9a76a"/>${[34,42,50,58,66].map(y=>`<path d="M36 ${y} H84" stroke="#8a7350" stroke-width="1.2" opacity=".7"/>`).join('')}</svg>`;
ICON.pater=BOOK('#5a2e2a','The Renaissance','Pater · 1873');
ICON.dorian=BOOK('#2c2c34','Dorian Gray','Wilde · 1890');
ICON.chevalier=BOOK('#2a4a7a','Girl with a','Pearl Earring');
ICON.poe=BOOK('#3a2a2a','The Oval','Portrait · Poe');
ICON.poliziano=BOOK('#7a5a2a','Stanze','Poliziano · 1478');
ICON.iliad=BOOK('#4a3a24','The Iliad','Book V');
// where each sitter's eyes are, as fractions of the painting's width and height (x, y, eye width).
// If an eye sits slightly off, open the page with ?eyes, drag the markers, and copy the numbers here.
const EYES = {
  0: [[.413,.272,.05],[.535,.267,.05]],      // Mona Lisa
  1: [[.365,.395,.075],[.585,.375,.075]],    // Girl with a Pearl Earring
  2: [],                                     // The Starry Night: the sky follows you instead
  3: [[.487,.233,.012],[.511,.230,.012]]     // The Birth of Venus
};
const PAINTINGS = [
  { img: W('Mona_Lisa,_by_Leonardo_da_Vinci,_from_C2RMF_retouched.jpg'), title: 'Make her smile', sig: '– La Gioconda', label: 'Mona Lisa, Leonardo da Vinci',
    blurb: "Gioconda has been written about for five centuries. Bring her the critic who adored her, never the novel about a portrait that rots.",
    good: { name: 'Pater, The Renaissance', icon: 'pater', mood: 'Pater called her older than the rocks around her. She liked that.' },
    bad:  { name: 'The Picture of Dorian Gray', icon: 'dorian', mood: 'A portrait that ages for its sitter? She has been sitting since 1503.' } },
  { img: W('Johannes_Vermeer_(1632-1675)_-_The_Girl_With_The_Pearl_Earring_(1665).jpg'), title: 'Catch her eye', sig: '– het meisje', label: 'Girl with a Pearl Earring, Johannes Vermeer',
    blurb: 'Nobody knows who she was. Hand her the novel that gave her a name, and keep Poe and his painter far away.',
    good: { name: 'Chevalier, Girl with a Pearl Earring', icon: 'chevalier', mood: 'Tracy Chevalier called her Griet. She turns to look.' },
    bad:  { name: 'Poe, The Oval Portrait', icon: 'poe', mood: "Poe's painter paints his wife until there's nothing left of her. She'd rather not." } },
  { img: W('Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg'), title: 'Keep him up all night', sig: '– Vincent', label: 'The Starry Night, Vincent van Gogh',
    blurb: 'Vincent wrote to his brother that the stars made him dream. Give him his letters; spare him the lecture hall.',
    good: { name: 'Letters to Theo', icon: 'letter', mood: '"The sight of the stars makes me dream," he wrote. The sky turns a little faster.' },
    bad:  { name: "Whitman's learn'd astronomer", icon: 'scroll', mood: 'Charts and columns of figures? Like Whitman, he slips outside to look up in silence.' } },
  { img: W('Sandro_Botticelli_-_La_nascita_di_Venere_-_Google_Art_Project_-_edited.jpg'), title: 'Make her blush', sig: '– Venere', label: 'The Birth of Venus, Sandro Botticelli',
    blurb: 'Botticelli likely painted her from a Florentine poem. Read her those verses, and skip the part of Homer where she gets hurt.',
    good: { name: 'Poliziano, Stanze', icon: 'poliziano', mood: 'The poem that put her on the shell. A little pink in her cheeks.' },
    bad:  { name: 'The Iliad, Book V', icon: 'iliad', mood: 'Diomedes wounds her hand and she flees the field. Too soon.' } }
];

(function(){
  const hero=document.getElementById('hero'),canvas=document.getElementById('canvas'),A=document.getElementById('offerA'),B=document.getElementById('offerB');
  const fol=document.getElementById('follower'),mood=document.getElementById('mood');
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let i=0;
  function show(k,instant){
    const p=PAINTINGS[k];i=k;
    const set=()=>{canvas.style.backgroundImage=`url("${p.img}")`;canvas.setAttribute('aria-label',p.label);canvas.classList.remove('fade');};
    if(instant||still)set();else{canvas.classList.add('fade');setTimeout(()=>{set();heroEyes&&heroEyes();},380);}
    document.getElementById('title').textContent=p.title;document.getElementById('blurb').textContent=p.blurb;document.getElementById('sig').textContent=p.sig;mood.textContent='';
    // which side the good and bad offers sit on changes, so it's a little game
    const [L,Rr]=k%2?[p.good,p.bad]:[p.bad,p.good];
    [[A,L],[B,Rr]].forEach(([el,o])=>{el.innerHTML=ICON[o.icon]+`<span>${o.name}</span>`;el.dataset.kind=o===p.good?'good':'bad';el.dataset.mood=o.mood;el.setAttribute('aria-label',`Offer ${p.label.split(',')[0]}: ${o.name}`);});
    document.getElementById('faces').innerHTML=PAINTINGS.filter((_,j)=>j!==k).slice(0,3).map(q=>`<span style="background-image:url('${q.img.replace('width=1600','width=120')}')"></span>`).join('');
    hero.classList.remove('happy','sad');
    PAINTINGS.forEach(q=>{const im=new Image();im.src=q.img;}); // warm up the others
  }
  const react=el=>{const kind=el.dataset.kind;hero.classList.remove('happy','sad','shake');void hero.offsetWidth;hero.classList.add(kind==='good'?'happy':'sad');if(kind==='bad')hero.classList.add('shake');mood.textContent=el.dataset.mood;};
  const calm=()=>{hero.classList.remove('happy','sad','shake');mood.textContent='';};
  [A,B].forEach(el=>{el.addEventListener('pointerenter',()=>{react(el);fol.classList.add('big');fol.textContent=el.dataset.kind==='good'?'offer':'hmm';});
    el.addEventListener('pointerleave',()=>{calm();fol.classList.remove('big');fol.textContent='';});
    el.addEventListener('focus',()=>react(el));el.addEventListener('blur',calm);el.addEventListener('click',()=>react(el));});
  document.getElementById('others').addEventListener('click',()=>show((i+1)%PAINTINGS.length));
  document.getElementById('nextLink').addEventListener('click',e=>{e.preventDefault();show((i+1)%PAINTINGS.length);});

  // cursor follower and a gentle parallax: the painting leans away, the offers lean toward you
  let mx=.5,my=.5,fx=0,fy=0,tx=0,ty=0,raf=0;
  hero.addEventListener('pointermove',e=>{const r=hero.getBoundingClientRect();tx=e.clientX-r.left;ty=e.clientY-r.top;mx=tx/r.width;my=ty/r.height;if(!raf)raf=requestAnimationFrame(loop);});
  hero.addEventListener('pointerleave',()=>{mx=.5;my=.5;if(!raf)raf=requestAnimationFrame(loop);});
  let px=0,py=0;
  function loop(){raf=0;fx+=(tx-fx)*.18;fy+=(ty-fy)*.18;fol.style.transform=`translate(${fx}px,${fy}px)`;
    const gx=(mx-.5),gy=(my-.5);px+=(gx-px)*.08;py+=(gy-py)*.08;
    if(!still){canvas.style.transform=`translate(${-px*18}px,${-py*12}px) scale(1.02)`;
      A.style.transform=`translate(${px*26}px,${py*18}px)`;B.style.transform=`translate(${px*30}px,${py*22}px)`;}
    if(Math.abs(tx-fx)+Math.abs(ty-fy)>.5||Math.abs(gx-px)+Math.abs(gy-py)>.002)raf=requestAnimationFrame(loop);}

  // ── frames, drawn to fit each painting: gilded baroque, pink enamel, painted blue, red lace
  // the real frames: each picture's window (left, top, width, height as fractions of the frame image)
  const FRAME_IMG={"gold": {"ar": 0.8497, "win": [0.1703, 0.1503, 0.6662, 0.7079]}, "pink": {"ar": 0.8187, "win": [0.1982, 0.1477, 0.6054, 0.6944]}, "blue": {"ar": 1.2961, "win": [0.1536, 0.1991, 0.6929, 0.5996]}, "lace": {"ar": 0.8217, "win": [0.1006, 0.1021, 0.8003, 0.7984]}};
  const FRAMES=['gold','lace','blue','pink'];   // Mona Lisa, Pearl Earring, Starry Night, Venus
  function frameSVG(kind,pw,ph){
    const t=Math.round(Math.min(pw,ph)*.2),W=pw+2*t,H=ph+2*t,id=kind+Math.random().toString(36).slice(2,7);
    const hole=`M${t} ${t}h${pw}v${ph}h${-pw}z`,outer=`M0 0h${W}v${H}h${-W}z`;
    const mids=[[W/2,t*.5,0],[W/2,H-t*.5,180],[t*.5,H/2,-90],[W-t*.5,H/2,90]],corners=[[t*.55,t*.55,0],[W-t*.55,t*.55,90],[W-t*.55,H-t*.55,180],[t*.55,H-t*.55,270]];
    let defs='',body='';
    if(kind==='gold'){
      defs=`<linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dc8e"/><stop offset=".35" stop-color="#b8862e"/><stop offset=".55" stop-color="#f0d07c"/><stop offset=".8" stop-color="#8e6420"/><stop offset="1" stop-color="#d9b25a"/></linearGradient>
        <pattern id="m${id}" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0H9M0 0V9" stroke="#6e4c14" stroke-width=".8" opacity=".35"/></pattern>`;
      const scroll=(x,y,r,s)=>`<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})" fill="none" stroke="#6e4c14" stroke-width="3" stroke-linecap="round"><path d="M-60 10 C-40 -30 -10 -30 0 -6 C10 -30 40 -30 60 10" stroke="#fff3c0" stroke-width="7" opacity=".55"/><path d="M-60 10 C-40 -30 -10 -30 0 -6 C10 -30 40 -30 60 10"/><path d="M-24 0 C-24 -16 -8 -16 -8 -4 M24 0 C24 -16 8 -16 8 -4"/><path d="M-18 14 L0 -2 L18 14 Z" fill="#c99a3e" stroke="#6e4c14"/>${[-14,-7,0,7,14].map(a=>`<path d="M0 12 L${a} -2"/>`).join('')}</g>`;
      body=`<path d="${outer}${hole}" fill-rule="evenodd" fill="url(#g${id})"/><path d="${outer}${hole}" fill-rule="evenodd" fill="url(#m${id})"/>
        <rect x="${t*.18}" y="${t*.18}" width="${W-t*.36}" height="${H-t*.36}" fill="none" stroke="#6e4c14" stroke-width="3" opacity=".7"/>
        <rect x="${t*.82}" y="${t*.82}" width="${W-t*1.64}" height="${H-t*1.64}" fill="none" stroke="#fff1bd" stroke-width="5" opacity=".6"/>
        <rect x="${t-6}" y="${t-6}" width="${pw+12}" height="${ph+12}" fill="none" stroke="#5a3c0e" stroke-width="5"/>
        ${mids.map(([x,y,r])=>scroll(x,y,r,t/55)).join('')}${corners.map(([x,y,r])=>scroll(x,y,r+45,t/62)).join('')}`;
    } else if(kind==='pink'){
      defs=`<linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d98d99"/><stop offset=".5" stop-color="#b9606f"/><stop offset="1" stop-color="#d4848f"/></linearGradient>`;
      const swirl=[...Array(14)].map((_,k)=>{const side=k%4,f=(k*37%100)/100;const p=side===0?[t*.2+f*(W-t*.4),t*.5]:side===1?[W-t*.5,t*.2+f*(H-t*.4)]:side===2?[t*.2+f*(W-t*.4),H-t*.5]:[t*.5,t*.2+f*(H-t*.4)];
        return `<path d="M${p[0]-t*.3} ${p[1]} q${t*.15} ${-t*.3} ${t*.3} 0 t${t*.3} 0" fill="none" stroke="#f3c6cf" stroke-width="${t*.05}" opacity=".55"/>`;}).join('');
      const flower=(x,y,j)=>`<g transform="translate(${x} ${y})">${[0,72,144,216,288].map(a=>`<ellipse cx="0" cy="${-t*.13}" rx="${t*.07}" ry="${t*.12}" fill="#e9e27a" stroke="#c9b84a" stroke-width="1.2" transform="rotate(${a})"/>`).join('')}<circle r="${t*.07}" fill="${j}"/><circle cx="${-t*.02}" cy="${-t*.02}" r="${t*.025}" fill="#fff" opacity=".8"/></g>`;
      const vine=`<path d="M${t*.25} ${t*.5} C${W*.25} ${t*.1} ${W*.3} ${t*.9} ${W*.5} ${t*.45} S${W*.75} ${t*.1} ${W-t*.25} ${t*.5}" fill="none" stroke="#e4e4ea" stroke-width="2.4"/>`;
      body=`<path d="${outer}${hole}" fill-rule="evenodd" fill="url(#g${id})" stroke="#c9c9d2" stroke-width="5"/>${swirl}${vine}<g transform="rotate(180 ${W/2} ${H/2})">${vine}</g>
        <rect x="${t-4}" y="${t-4}" width="${pw+8}" height="${ph+8}" rx="10" fill="none" stroke="#dcdce4" stroke-width="5"/>
        ${[[W*.25,t*.5,'#8a3fb0'],[W*.72,t*.5,'#d6417a'],[t*.5,H*.35,'#d6417a'],[t*.5,H*.72,'#8a3fb0'],[W-t*.5,H*.3,'#8a3fb0'],[W-t*.5,H*.66,'#d6417a'],[W*.35,H-t*.5,'#8a3fb0'],[W*.78,H-t*.5,'#d6417a']].map(([x,y,j])=>flower(x,y,j)).join('')}`;
    } else if(kind==='blue'){
      defs=`<linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9c7d6"/><stop offset="1" stop-color="#8fa2b6"/></linearGradient>`;
      const acanthus=(x,y,r)=>`<g transform="translate(${x} ${y}) rotate(${r}) scale(${t/58})" fill="#eef0e6" stroke="#7d8fa3" stroke-width="2"><path d="M-10 40 C-40 30 -46 -6 -20 -20 C-8 -26 6 -16 0 -6 C-6 4 -20 0 -16 -10 M10 40 C40 30 46 -6 20 -20" fill="none" stroke-width="7" stroke="#f3f1e6"/><path d="M-10 40 C-40 30 -46 -6 -20 -20 C-8 -26 6 -16 0 -6 C-6 4 -20 0 -16 -10" fill="none"/><path d="M10 40 C40 30 46 -6 20 -20 C8 -26 -6 -16 0 -6" fill="none"/></g>`;
      const beads=[];const step=t*.16;
      for(let x=t*.75;x<W-t*.75;x+=step)beads.push([x,t*.75],[x,H-t*.75]);for(let y=t*.75+step;y<H-t*.75;y+=step)beads.push([t*.75,y],[W-t*.75,y]);
      body=`<path d="${outer}${hole}" fill-rule="evenodd" fill="url(#g${id})"/>
        <rect x="${t*.12}" y="${t*.12}" width="${W-t*.24}" height="${H-t*.24}" fill="none" stroke="#f1eedf" stroke-width="${t*.06}" opacity=".8"/>
        ${beads.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="${t*.035}" fill="#f1eedf"/>`).join('')}
        <rect x="${t-5}" y="${t-5}" width="${pw+10}" height="${ph+10}" fill="none" stroke="#f1eedf" stroke-width="6"/>
        ${corners.map(([x,y,r])=>acanthus(x,y,r+45)).join('')}${[[t*.5,H*.32,-90],[t*.5,H*.68,-90],[W-t*.5,H*.32,90],[W-t*.5,H*.68,90]].map(([x,y,r])=>acanthus(x,y,r)).join('')}`;
    } else {
      defs=`<pattern id="n${id}" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 0H10M0 0V10" stroke="#c0182b" stroke-width="1.2"/></pattern>`;
      const heart=(x,y,s)=>`<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 28 C-36 4 -30 -26 -10 -24 C-4 -24 0 -18 0 -14 C0 -18 4 -24 10 -24 C30 -26 36 4 0 28Z" fill="#fff" stroke="#c0182b" stroke-width="5"/><path d="M0 28 C-36 4 -30 -26 -10 -24 C-4 -24 0 -18 0 -14 C0 -18 4 -24 10 -24 C30 -26 36 4 0 28Z" fill="url(#n${id})"/><rect x="-5" y="-6" width="10" height="10" fill="#c0182b"/></g>`;
      const waves=(len,vert)=>{let d='';const n=Math.max(2,Math.round(len/(t*2.2)));for(let k=0;k<=n*20;k++){const f=k/(n*20),off=Math.sin(f*n*Math.PI*2)*t*.32;d+=(k?' L':'M')+(vert?`${t/2+off} ${f*len}`:`${f*len} ${t/2+off}`);}return d;};
      body=`<path d="${outer}${hole}" fill-rule="evenodd" fill="#fffaf6"/><path d="${outer}${hole}" fill-rule="evenodd" fill="url(#n${id})" opacity=".85"/>
        <path d="${waves(W,false)}" fill="none" stroke="#c0182b" stroke-width="6"/><path d="${waves(W,false)}" transform="translate(0 ${H-t})" fill="none" stroke="#c0182b" stroke-width="6"/>
        <path d="${waves(H,true)}" fill="none" stroke="#c0182b" stroke-width="6"/><path d="${waves(H,true)}" transform="translate(${W-t} 0)" fill="none" stroke="#c0182b" stroke-width="6"/>
        <rect x="3" y="3" width="${W-6}" height="${H-6}" fill="none" stroke="#c0182b" stroke-width="5"/><rect x="${t-4}" y="${t-4}" width="${pw+8}" height="${ph+8}" fill="none" stroke="#c0182b" stroke-width="5"/>
        ${[...corners,...mids].map(([x,y])=>heart(x,y,t/64)).join('')}`;
    }
    return {svg:`<svg class="frame" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><defs>${defs}</defs>${body}</svg>`,t,W,H};
  }

  // ── tracking eyes: a soft-edged patch of the painting over each eye, nudged toward the cursor
  const eyeSets=[];
  function addEyes(host,url,rect,k){
    host.querySelectorAll('.eye,.skyglow').forEach(e=>e.remove());
    const list=EYES[k]||[];
    if(!list.length){const g=document.createElement('div');g.className='skyglow';host.appendChild(g);eyeSets.push({host,glow:g});return;}
    const set={host,eyes:[]};
    list.forEach(([x,y,w])=>{const ew=w*rect.w,eh=ew*.62,cx=rect.x+x*rect.w,cy=rect.y+y*rect.h;
      const e=document.createElement('div');e.className='eye';
      Object.assign(e.style,{left:(cx-ew/2)+'px',top:(cy-eh/2)+'px',width:ew+'px',height:eh+'px',backgroundImage:`url("${url}")`,backgroundSize:`${rect.w}px ${rect.h}px`});
      const bx=-(cx-ew/2-rect.x),by=-(cy-eh/2-rect.y);e.style.backgroundPosition=`${bx}px ${by}px`;
      host.appendChild(e);set.eyes.push({e,bx,by,max:Math.max(1.2,ew*.07)});});
    eyeSets.push(set);
  }
  let px0=innerWidth/2,py0=innerHeight/2,eyeRaf=0;
  function lookAt(){eyeRaf=0;
    eyeSets.forEach(s=>{if(!s.host.isConnected)return;
      if(s.glow){const r=s.host.getBoundingClientRect();s.glow.style.setProperty('--gx',((px0-r.left)/r.width*100)+'%');s.glow.style.setProperty('--gy',((py0-r.top)/r.height*100)+'%');return;}
      s.eyes.forEach(o=>{const r=o.e.getBoundingClientRect(),dx=px0-(r.left+r.width/2),dy=py0-(r.top+r.height/2),d=Math.hypot(dx,dy)||1,k=Math.min(1,d/260)*o.max;
        o.e.style.backgroundPosition=`${o.bx+dx/d*k}px ${o.by+dy/d*k}px`;});});
  }
  addEventListener('pointermove',e=>{px0=e.clientX;py0=e.clientY;if(!eyeRaf)eyeRaf=requestAnimationFrame(lookAt);},{passive:true});

  // ── build the 2 × 2 gallery
  const grid=document.getElementById('grid');
  PAINTINGS.forEach((p,k)=>{
    const b=document.createElement('button');b.className='framed';b.type='button';b.setAttribute('aria-label',`Show ${p.label} at the top`);
    b.innerHTML=`<div class="pic"><img alt="${p.label}" src="${p.img.replace('width=1600','width=900')}"></div><span class="cap">${p.label}</span>`;
    grid.appendChild(b);
    const img=b.querySelector('img');
    const build=()=>{
      // stretch the frame just enough that its window fits this painting exactly
      const a=img.naturalWidth/img.naturalHeight||.7,F=FRAME_IMG[FRAMES[k]],[wl,wt,ww,wh]=F.win;
      const boxAR=wh*a/ww;
      b.insertAdjacentHTML('afterbegin',`<div class="fbox" style="aspect-ratio:${boxAR}"><img class="fimg" src="img/frames/${FRAMES[k]}.webp" alt="" draggable="false"></div>`);
      const box=b.querySelector('.fbox'),pic=b.querySelector('.pic');box.insertBefore(pic,box.firstChild);
      Object.assign(pic.style,{left:(wl*100)+'%',top:(wt*100)+'%',width:(ww*100)+'%',height:(wh*100)+'%'});
      b.style.maxWidth=(boxAR<1?420:540)+'px';
      requestAnimationFrame(()=>{const r=pic.getBoundingClientRect();addEyes(pic,img.src,{x:0,y:0,w:r.width,h:r.height},k);});};
    if(img.complete&&img.naturalWidth)build();else img.addEventListener('load',build,{once:true});
    b.addEventListener('click',()=>{show(k);hero.scrollIntoView({behavior:'smooth',block:'start'});});
  });
  // the frames tilt very slightly toward you as you move
  addEventListener('pointermove',e=>{grid.querySelectorAll('.framed').forEach(f=>{const r=f.getBoundingClientRect(),dx=(e.clientX-(r.left+r.width/2))/innerWidth,dy=(e.clientY-(r.top+r.height/2))/innerHeight;
    f.style.transform=`perspective(1200px) rotateY(${(dx*8).toFixed(2)}deg) rotateX(${(-dy*6).toFixed(2)}deg)`;});},{passive:true});
  addEventListener('resize',()=>{grid.querySelectorAll('.framed').forEach((b,k)=>{const pic=b.querySelector('.pic'),r=pic.getBoundingClientRect();addEyes(pic,b.querySelector('img').src,{x:0,y:0,w:r.width,h:r.height},k);});});

  // ── the hero's eyes: work out where the painting actually sits under 'cover' cropping
  function heroEyes(){
    const p=PAINTINGS[i],im=new Image();im.onload=()=>{const c=canvas.getBoundingClientRect(),cs=getComputedStyle(canvas);
      const s=Math.max(c.width/im.naturalWidth,c.height/im.naturalHeight),w=im.naturalWidth*s,h=im.naturalHeight*s;
      const ox=(c.width-w)*.5,oy=(c.height-h)*.3;addEyes(canvas,p.img,{x:ox,y:oy,w,h},i);};im.src=p.img;
  }
  show(0,true);heroEyes();
  // ── ?eyes: drag the pink dots onto each sitter's eyes, then copy the numbers into EYES above
  if(/[?&]eyes\b/.test(location.search)){
    const btn=document.createElement('button');btn.textContent='copy eye positions';btn.className='pill';
    Object.assign(btn.style,{position:'fixed',left:'16px',bottom:'16px',zIndex:99,background:'#2a2219',color:'#fff',cursor:'pointer'});
    btn.onclick=()=>{const t=JSON.stringify(EYES);navigator.clipboard&&navigator.clipboard.writeText(t);btn.textContent='copied: '+t.slice(0,60)+'…';};
    document.body.appendChild(btn);
    setTimeout(()=>{grid.querySelectorAll('.framed').forEach((b,k)=>{const pic=b.querySelector('.pic');b.style.cursor='default';
      (EYES[k]||[]).forEach((ey,j)=>{const m=document.createElement('div');m.className='eyemark';m.style.left=(ey[0]*100)+'%';m.style.top=(ey[1]*100)+'%';pic.appendChild(m);
        m.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();m.setPointerCapture(e.pointerId);
          const mv=ev=>{const r=pic.getBoundingClientRect();ey[0]=+((ev.clientX-r.left)/r.width).toFixed(3);ey[1]=+((ev.clientY-r.top)/r.height).toFixed(3);m.style.left=(ey[0]*100)+'%';m.style.top=(ey[1]*100)+'%';};
          const up=()=>{m.removeEventListener('pointermove',mv);m.removeEventListener('pointerup',up);const r=pic.getBoundingClientRect();addEyes(pic,b.querySelector('img').src,{x:0,y:0,w:r.width,h:r.height},k);};
          m.addEventListener('pointermove',mv);m.addEventListener('pointerup',up);});
        m.addEventListener('click',e=>e.stopPropagation());});});},1500);
  }
})();
</script>
<script src="../gh.js"></script>
</body>
